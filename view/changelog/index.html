<main class="wrap"><div class="cl-h"><h1>Changelog</h1><p>92 changes in 3 days. Pick a day, then filter by product.</p></div>
<div class="cl-days" id="days"></div><div class="cl-bar"><div id="chips" style="display:contents"></div><input class="cl-q" id="q" type="search" placeholder="Search all changes…" aria-label="Search changes"></div><div class="cl-g" id="grid"></div></main>
<footer>Haritt Group · Changelog</footer><script>(function(){var D=[{"date": "2026-10-14", "wd": "Wed", "day": 14, "mon": "Oct", "wk": "42", "yr": 2026, "items": [{"k": 1, "name": "Intro emails tab", "site": "Haritt admin", "title": "New Intro emails tab on the Marketing page, for people who do not know our products yet. Pick a brand (HV World, HV Reset, HV Vault, HV Test, Haritt, Haritt Developers) and a design (Personal note, Meet the app, What I'm building, Dark pitch). Each mail has versions to choose from: Question, Pain point, Direct, Curious, Classic (the first simpler designs) and, for HV World, Classic + system. Everything stays editable and ready to send.", "img": "2026-10-14-intro-emails-tab.jpg"}, {"k": 2, "name": "Developers and Haritt intro mails", "site": "Haritt Developers", "title": "Haritt Developers intro mails open with business problems (hard to find online, too much work by hand) with no person's name by default. The Haritt mail is about our mission, vision and how we build, with a small Our ventures section (HV World, Haritt Developers) in the Haritt cream and red look, no product pitch.", "img": "2026-10-14-intro-haritt-dev.jpg"}, {"k": 3, "name": "Each app's own look in mails", "site": "HV World", "title": "HV World, HV Reset, HV Vault and HV Test intro mails now wear their app's own look instead of plain white: HV World soft lavender glow, HV Vault lavender to peach glass, HV Test paper with a serif heading and gold line, with square corners. Mail text is shorter (one line), since the pictures tell the story.", "img": "2026-10-14-intro-app-themes.jpg"}, {"k": 4, "name": "Morning sky in HV Reset mails", "site": "HV Reset", "title": "HV Reset intro mails use the app's morning sky: light blue at the top with a sun glow, fading to peach and lavender, with dark text and the blue to pink button.", "img": "2026-10-14-intro-reset-morning.jpg"}, {"k": 5, "name": "Recipient name options", "site": "Haritt admin", "title": "Two separate ticks for the person's name: In the subject line (inbox) and In the greeting (Hi Aarav). The name never goes in the big heading. In Who gets it, each ticked person gets a name box, so you can send to Ps as Pulkit. Extra emails also take a name: Pulkit <pulkit@gmail.com>.", "img": "2026-10-14-intro-recipient-names.jpg"}, {"k": 6, "name": "Mails fit phones", "site": "Haritt admin", "title": "On phones the mail fills the whole screen with no side border or rounded corners, headings get smaller, and the font is closer to the design (Apple's font on iPhone, Roboto on Android). Laptop stays the same.", "img": "2026-10-14-intro-phone.jpg"}, {"k": 7, "name": "HV World branding in mails", "site": "HV World", "title": "HV World, HV Reset, HV Vault and HV Test mails no longer show the Haritt name. The HV World mail says A Haritt venture, with Haritt as a link without underline. The team name and logo link to the app's website, and the footer shows the HV World app links and a short tagline instead of the 'you are getting this' line.", "img": "2026-10-14-intro-branding.jpg"}, {"k": 8, "name": "Preview links show, not open", "site": "Haritt admin", "title": "Links inside the email preview no longer open when clicked. Point at a link to see where it goes, shown at the bottom of the preview.", "img": "2026-10-14-intro-preview-links.jpg"}, {"k": 9, "name": "Send fixes", "site": "Haritt admin", "title": "The Are you sure box now shows the real subject with the person's name (not {first}). A mail that went out but got an unclear reply from the mail script now counts as sent, not failed.", "img": "2026-10-14-mail-send-fixes.jpg"}, {"k": 10, "name": "App plan cover and phone fixes", "site": "HV Reset", "title": "The App launch plan page now has a cover image for link previews. On phones the Menu button is visible again on every admin page, and the dark mode tables are easier to read.", "img": "2026-10-14-app-plan-cover.jpg"}, {"k": 11, "name": "Co-founder access covers every page", "site": "Haritt", "title": "A person set as Co-founder now opens every admin page, including pages added later, and no longer turns into Custom when you change a row. The Team page also tops up Co-founders' access by itself when it opens. The public share link for App launch plan is fixed (haritt.com/view/app-plan/).", "img": "2026-10-14-app-plan-cover.jpg"}, {"k": 12, "name": "App launch plan page", "site": "HV Reset", "title": "New admin page 'App launch plan' for the team. Pick Android or iPhone with the two buttons at the top to see what each needs: store account and fees, ways to build (our web code inside an app, website in a frame, brand new app, Flutter, React Native) compared in a short table, the steps and who does each. Below are the costs, the challenges in plain words (reminders, Google sign-in, data and privacy, offline, store review) and who does what.", "img": "2026-10-14-app-launch-plan.jpg"}, {"k": 13, "name": "Phone hero diagram fixed", "site": "Haritt Developers", "title": "On phones the six services (Website, Brand, Marketing, Leads, AI & automation, E-commerce) sit in a small orbit around the logo and float gently up and down, like on desktop. Nothing goes off the screen or overlaps. A soft shine now sweeps across the logo every few seconds, on phone and desktop.", "img": "2026-10-14-developers-mobile-orbit.jpg"}, {"k": 14, "name": "Phone layout cleanup", "site": "Haritt Developers", "title": "Checked every Developers page at phone widths. Footer columns, service cards, process steps and Enquire buttons no longer get cut off at the right edge on small screens. Fixed a lowercase 'ai' in the AI service button.", "img": ""}, {"k": 15, "name": "Leadership section removed", "site": "Haritt Developers", "title": "The Leadership section (founder names and roles) is gone from the About page. The page now goes from Who we work with straight to Our name.", "img": ""}, {"k": 16, "name": "New link preview cover", "site": "HV Reset", "title": "When you share hvworld.haritt.com/hv-reset/ on WhatsApp, X, LinkedIn or anywhere else, the preview now shows a new cover: HV Reset introduced with its real dashboard, focus timer and HV AI screens, with 'Plan it. Track it. Improve it.' and 'by HV World'.", "img": "2026-10-14-hv-reset-link-cover.jpg"}]}, {"date": "2026-10-13", "wd": "Tue", "day": 13, "mon": "Oct", "wk": "42", "yr": 2026, "items": [{"k": 1, "name": "Dark mode fixed on every page", "site": "Haritt admin", "title": "Switching between light and dark now fades smoothly instead of jumping. Card titles on the Changelog and text on Setup, Rules, Launch, Open Source, Startups and Designs pages that were hard to read in dark mode are fixed (checked every page for contrast).", "img": "2026-10-13-dark-mode-fix.jpg"}, {"k": 2, "name": "Button hover and disabled states fixed", "site": "Haritt admin", "title": "Buttons no longer turn unreadable (red text on dark red) when you hover them. Hover, pressed and disabled looks are the same on every admin page, in light and dark mode.", "img": "2026-10-13-action-buttons.jpg"}, {"k": 3, "name": "Action buttons stand out", "site": "Haritt admin", "title": "Main actions (New playbook, Publish, Save, Send, Sign in, Give access, Mark fixed) are now solid red with an icon, so they are easy to find. Copy and download buttons got icons too. Marketing page now has a + New email button at the top. Hover, pressed and disabled states fixed on every button, light and dark (no more unreadable red-on-red).", "img": "2026-10-13-action-buttons.jpg"}, {"k": 4, "name": "Share links without the admin menu", "site": "Haritt admin", "title": "Pages that are set to Public can be opened at haritt.com/view/<page>/ without the admin menu. Private pages still ask for sign-in. The menu is also hidden for people who are not signed in.", "img": "2026-10-13-share-links.jpg"}, {"k": 5, "name": "Marketing: App emails and developer emails", "site": "Haritt admin", "title": "New App emails tab on the Marketing page shows every email the apps send (HV Reset, HV Vault, Beta join, reminder, leave and welcome back, guide) plus the Haritt Developers welcome, team and thank-you emails, so you can see exactly what people receive.", "img": "2026-10-13-app-emails.jpg"}, {"k": 6, "name": "Email templates list collapses", "site": "Haritt admin", "title": "The template picker on Marketing New email can be folded away so the editor and preview have more room.", "img": "2026-10-13-templates-collapse.jpg"}, {"k": 7, "name": "Playbooks in the menu and footer", "site": "haritt.com", "title": "Playbooks now has its own link in the haritt.com top menu and in the footer under Company. The RSS line was removed from the page.", "img": "2026-10-13-pb-footer.jpg"}, {"k": 8, "name": "First playbook published", "site": "haritt.com", "title": "The first playbook, How to organise a job search: a simple 5-step system, is live at haritt.com/playbooks with its own cover.", "img": "2026-10-13-pb-first-post.jpg"}, {"k": 9, "name": "Playbooks: Make cover and image prompt", "site": "Haritt admin", "title": "Make cover builds a shareable cover from a headline and a small line, in different frame styles (Sticky notes, Calendar, Premium frame), with an optional person illustration or your own photo. Copy image prompt gives you a ready prompt for an AI image tool.", "img": "2026-10-13-pb-make-cover.jpg"}, {"k": 10, "name": "Playbooks: formatting toolbar and action bar", "site": "Haritt admin", "title": "The editor has paragraph styles, alignment, bold, italic, colours and highlights, links, and blocks like checklist, table, FAQ and callout. A bar at the bottom keeps Save, Preview and Publish now always in reach.", "img": "2026-10-13-pb-editor.jpg"}, {"k": 11, "name": "Playbooks: starter playbooks", "site": "Haritt admin", "title": "Five starter playbooks with real HV Reset and HV Vault screenshots are ready to edit and publish.", "img": "2026-10-13-pb-starters.jpg"}, {"k": 12, "name": "New admin design, smoother pages", "site": "Haritt admin", "title": "Whole admin has a new calm look: soft Haritt red buttons, light and dark theme (toggle in the top bar, remembered), real dark colours on every page. Overview shows Haritt Group with counts, admin pages in 4 clear groups above the websites, and a card per website with Maintenance, Banner, Edit content and Open site. Same left menu, search (Ctrl K) and profile on every page, pages fade smoothly and load faster. All earlier features kept.", "img": "2026-10-13-new-admin-design.jpg"}, {"k": 13, "name": "Contacts database for emails", "site": "Haritt admin", "title": "New Contacts tab on the Marketing page: the master list for all of Haritt, with name, email, segment (B2C for HV World, B2B for Haritt Developers) and product. Pick HV Reset, HV Vault, HV Test, HV World or Haritt Developers to see only that product's people, so separate teams can work on their own. Beta testers and developer enquiries are added when the page opens, and anyone who signs in to HV Reset or HV Vault is added by the app itself. Paste 100+ lines to import, search, remove, export to CSV; New email picks people from this list (All B2C and All B2B buttons). Needs the Firestore rules re-pasted once.", "img": "2026-10-13-marketing-contacts.jpg"}, {"k": 14, "name": "Marketing email templates", "site": "Haritt admin", "title": "Eleven clearly different email designs on the Marketing page: Launch, Editorial, Spotlight, Midnight, Color block, Showcase, Product roundup, Haritt classic, Pastel glass, Video and Video banner (dark, big website-video thumbnail with a watch link). Every brand gets its own content: its own name, logo, colours and graphic, and Haritt Developers shows its five services instead of the HV apps. A Website video picker fills the picture, link and button from the HV Reset tutorial, the security video or the HV World film, and a Graphic dropdown lists each brand's own website graphics first. Brand, Template and Message sections fold away when you tap their title, and picking a template no longer reloads the others.", "img": "2026-10-13-marketing-templates.jpg"}, {"k": 15, "name": "Playbooks (articles) system", "site": "haritt.com", "title": "New Playbooks section for haritt.com (haritt.com/playbooks): a listing page, a page for every article, category pages, an RSS feed, article schema, sitemap entries and share links. Write them in the new admin page Playbooks: block editor (headings, lists, quotes, callouts, images, product cards), image library that resizes automatically, search title and description with a Google preview and a search checklist, preview on desktop and phone, publish, schedule or unpublish. Articles go live within about 10 minutes through an automatic site build. Needs the new Firestore rules pasted once (Rules & scripts) and the Playbooks permission on the Team page. Formatting tools: bold, italic, underline, strikethrough, super/subscript, inline code, text colours, highlights, links, alignment and sizes per block, small headings, checklists, tables, code blocks, YouTube videos, buttons, FAQ blocks (with FAQ schema for Google), six font styles for a post. A bar at the bottom always shows Preview, Discard changes, Save and Publish. Unsaved drafts survive a refresh.", "img": "2026-10-13-playbooks.jpg"}, {"k": 16, "name": "Marketing emails: send and dashboard", "site": "Haritt admin", "title": "New Marketing page in the admin (owner only). Pick a brand (HV World, HV Reset, HV Vault, HV Test, Haritt, Haritt Developers), write the message with a live preview, tick who gets it, send a test to yourself, then send. Every send is saved, and the Dashboard shows emails sent, delivered (estimated), bounced, failed, people emailed, clicks and click rate, with 30 day charts, per brand totals, top links and a per campaign list with every recipient. The button link is counted through haritt.com/r/. A bounce check reads Gmail's failed-delivery replies and blocks those addresses, and a Do not email list keeps people out of future sends. Opens are not shown because Gmail cannot report them. Needs the new Firestore rules and emails script pasted from Rules & scripts.", "img": "2026-10-13-marketing.jpg"}, {"k": 17, "name": "Public pages switch and other saved states fixed", "site": "Haritt admin", "title": "The Public switch on the Team page showed 'Page is public now' but stayed off after reload, because Firestore returned the saved values in a different order than the page expected (the same bug also kept the Beta analytics switch showing off). Fixed. Also fixed on the Beta page: opening a report right after a refresh could overwrite a Fixed status with Received. Every switch, save and delete on Team, Overview, Social accounts, Enquiries and Beta was tested and checked after a reload.", "img": "2026-10-13-admin-consistent.jpg"}, {"k": 18, "name": "Admin checked page by page", "site": "Haritt admin", "title": "Every admin page was tested signed in, on desktop and phone, in light and dark mode: same top bar and profile everywhere, sidebar hide and fold working, no sideways scroll, and one tab title style (Page · Haritt Admin). Fixed the sidebar on the Guides pages where item names wrapped, and the Haritt and Haritt Developers logos now load from the admin itself.", "img": "2026-10-13-admin-consistent.jpg"}, {"k": 19, "name": "Same top bar and profile on every admin page", "site": "Haritt admin", "title": "Your photo, email and Sign out now show on every admin page (they were missing on Covers, Brand, Guides, Social and Design pages). The top bar stays fixed while you scroll instead of scrolling away, and on the locked pages the sidebar appears only after access is confirmed.", "img": "2026-10-13-admin-consistent.jpg"}, {"k": 20, "name": "Smaller sidebar with hide button", "site": "Haritt admin", "title": "The admin sidebar is now compact so it fits without scrolling. Company and Guides & setup can be folded, and a menu button next to the logo hides or shows the whole sidebar (it remembers your choice). The sidebar now appears only after sign-in is confirmed (not during loading), and has a visible \"Hide menu\" link at its top.", "img": "2026-10-13-admin-sidebar-compact.jpg"}, {"k": 21, "name": "Each website has its own page in the admin", "site": "Haritt admin", "title": "Clicking a website in the sidebar (Haritt, Haritt Developers, HV World, HV Reset, HV Vault, HV Test) now opens that website's own page with its maintenance switch, the banner and, for HV World, its home page settings; the sidebar highlights it. The admin also opens faster: it shows the last saved settings at once and refreshes them in the background, and connects to Google earlier. The Overview now only shows the whole admin; the banner and HV World home page settings moved to the website pages.", "img": "2026-10-13-admin-site-pages.jpg"}, {"k": 22, "name": "Loading screen instead of sign-in flash", "site": "Haritt admin", "title": "On refresh the admin now shows a short loading screen until sign-in is checked. The Sign in card only appears if you are really signed out. The old HV World top bar no longer flashes before the new menu appears.", "img": "2026-10-13-admin-loading.jpg"}, {"k": 23, "name": "New admin sidebar with logos", "site": "Haritt admin", "title": "The admin now has a left sidebar grouped as Overview, Websites (Haritt, Haritt Developers, HV World, HV Reset, HV Vault, HV Test with their logos), Company and Guides & setup. First step of the Haritt-first admin rework.", "img": "2026-10-13-admin-sidebar.jpg"}, {"k": 24, "name": "Real visitors view", "site": "Haritt admin", "title": "Analytics counts your own visits too, and only you (owner) get a View switch: All visits or Real visitors only (without you); team members and co-founders never see it", "img": "2026-10-13-analytics-own.jpg"}, {"k": 25, "name": "Analytics for haritt.com and developers", "site": "Haritt admin", "title": "Analytics now covers haritt.com and developers.haritt.com as full sections like HV World: visitors per day, funnel, where visitors come from, campaigns, top pages, devices, retention, contact and email clicks, scroll depth, and for developers the enquiry form (started, sent) and service interest; link maker has pages for both sites", "img": "2026-10-13-analytics-sites.jpg"}, {"k": 26, "name": "Admin now lives at haritt.com/admin", "site": "Haritt admin", "title": "The Haritt admin is now published on haritt.com/admin, the permanent address, next to the website. Sign-in needs haritt.com added in Firebase once. The old hvworld.haritt.com/admin address now redirects here.", "img": "2026-10-13-haritt-admin.jpg"}, {"k": 27, "name": "Page access for every admin page", "site": "Haritt admin", "title": "Team & access now lists every admin page (Brand assets, Covers, Design decisions, Infrastructure, Launch guide, haritt.com setup, Claude programs, Rules, Changelog), not just a few. Each of those pages now asks for sign-in and opens only for people the founder gave access to. Changing the social passphrase stays founder-only. The founder can also switch any of these pages to Public from Team & access, so it opens for anyone with the link without sign-in.", "img": "2026-10-13-page-access.jpg"}, {"k": 28, "name": "Social Media Accounts", "site": "Haritt admin", "title": "New admin section for our social logins, grouped by brand (Haritt Group, Haritt Developers, HV World, or any brand you add). Each login keeps platform, username or email, password, where the verification code goes, recovery email and phone, and notes. Platforms and brands can be added from the page itself. Everything secret is encrypted in the browser with a team passphrase before it is saved; team members you give access to can show and copy it, and it locks itself after 10 idle minutes. Deleting needs the passphrase too, and the owner can change the passphrase (everything is re-encrypted at once)", "img": "2026-10-13-social-accounts.jpg"}, {"k": 29, "name": "Admin on phones", "site": "Haritt admin
