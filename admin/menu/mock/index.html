<html lang="en">

<title>Menu mock · Haritt Admin</title>

<style>
:root{--mn-w:256px;--mn-top:56px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font,Inter,system-ui,-apple-system,sans-serif);-webkit-font-smoothing:antialiased}
.pi{width:20px;height:20px;flex:none;display:block}
/* top bar */
.mn-top{position:fixed;inset:0 0 auto;height:var(--mn-top);z-index:50;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.mn-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;text-decoration:none;color:inherit;width:calc(var(--mn-w) - 16px)}
.mn-brand img{width:28px;height:28px;border-radius:22%}
.mn-brand small{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--soft);background:var(--sb);border-radius:99px;padding:3px 8px}
.mn-q{display:flex;align-items:center;gap:10px;width:min(420px,40vw);height:36px;padding:0 8px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--faint);font:inherit;font-size:14px;cursor:pointer}
.mn-q kbd{margin-left:auto;font-family:inherit;font-weight:600;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--sb);color:var(--soft)}
.mn-sp{flex:1}
.mn-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--soft);display:grid;place-items:center;cursor:pointer}
.mn-btn:hover{color:var(--ink)}
.mn-me{width:32px;height:32px;border-radius:50%;background:var(--accbg);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
/* sidebar */
.mn-side{position:fixed;top:var(--mn-top);bottom:0;left:0;width:var(--mn-w);overflow-y:auto;padding:12px 12px 28px;border-right:1px solid var(--line);background:var(--sb);scrollbar-width:thin}
.mn-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:18px 10px 6px}
.mn-h:first-child{padding-top:4px}
.mn-i{position:relative;display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:10px;color:var(--soft);text-decoration:none;font-size:14px;font-weight:550;transition:background .15s,color .15s}
.mn-i:hover{background:var(--line);color:var(--ink)}
.mn-i .f{display:none}
.mn-i.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line)}
.mn-i.on .r{display:none}.mn-i.on .f{display:block;color:var(--accent)}
.mn-i img{width:22px;height:22px;border-radius:22%;flex:none}
.mn-i span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn-i .x{width:14px;height:14px;opacity:.45}
.mn-b{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none}
html.adm-dark .mn-b{color:#0E0F12}
.mn-apps{margin:2px 0 4px 21px;padding-left:10px;border-left:1.5px solid var(--line)}
.mn-apps .mn-i{height:34px;font-size:13.5px}.mn-apps .mn-i img{width:20px;height:20px}
/* page */
.mn-main{padding:calc(var(--mn-top) + 28px) 32px 60px calc(var(--mn-w) + 32px);max-width:calc(var(--mn-w) + 1040px)}
.mn-crumb{font-size:13px;color:var(--faint);margin-bottom:6px}
.mn-main h1{margin:0 0 6px;font-size:28px;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.mn-main h1 img{width:40px;height:40px;border-radius:22%}
.mn-main h1 .pi{width:30px;height:30px;color:var(--accent)}
.mn-main p.d{margin:0 0 22px;color:var(--soft);font-size:15px}
.mn-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mn-c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:120px}
.mn-c i{display:block;height:10px;border-radius:6px;background:var(--sb);margin-bottom:10px}
.mn-c i:nth-child(1){width:40%}.mn-c i:nth-child(2){width:70%;height:22px}.mn-c i:nth-child(3){width:55%}
.mn-note{margin-top:22px;padding:14px 16px;border-radius:14px;background:var(--accbg);color:var(--ink);font-size:14px;line-height:1.55}
.mn-note b{color:var(--accent)}
/* phone */
.mn-tabs,.mn-sheet,.mn-bg,.mn-ttl{display:none}
@media(max-width:1023px){
  .mn-side,.mn-q,.mn-brand small{display:none}
  .mn-brand{width:auto}.mn-brand span{display:none}
  .mn-ttl{display:block;flex:1;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mn-sp{display:none}
  .mn-main{padding:calc(var(--mn-top) + 20px) 16px calc(96px + env(safe-area-inset-bottom))}
  .mn-main h1{font-size:23px}.mn-g{grid-template-columns:1fr 1fr}
  .mn-tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .mn-tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--faint);-webkit-tap-highlight-color:transparent}
  .mn-tab .pi{width:24px;height:24px}.mn-tab .f{display:none}
  .mn-tab.on{color:var(--accent)}.mn-tab.on .r{display:none}.mn-tab.on .f{display:block}
  .mn-tab:active{background:var(--sb)}
  .mn-bg{display:block;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s}
  .mn-bg.on{opacity:1;pointer-events:auto}
  .mn-sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:80;max-height:86vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 12px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s var(--ease);box-shadow:0 -20px 50px -20px rgba(0,0,0,.35)}
  .mn-sheet.on{transform:none}
  .mn-grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 10px}
  .mn-sh{display:flex;align-items:center;justify-content:space-between;padding:0 6px 6px}
  .mn-sh b{font-size:18px}
  .mn-sheet .mn-i{height:52px;font-size:16px;padding:0 12px;gap:14px}
  .mn-sheet .mn-i .pi{width:24px;height:24px}.mn-sheet .mn-i img{width:30px;height:30px}
  .mn-sheet .mn-apps{margin-left:26px}.mn-sheet .mn-apps .mn-i{height:48px;font-size:15px}.mn-sheet .mn-apps .mn-i img{width:26px;height:26px}
  .mn-sheet .mn-h{padding:16px 12px 4px}
  .mn-sub{display:block;font-size:12.5px;font-weight:450;color:var(--faint);margin-top:1px}
  .mn-sheet .mn-i span{line-height:1.25}
}
html.mn-lock,html.mn-lock body{overflow:hidden}
/* search */
.mn-pal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 0}
.mn-pal.on{display:flex}
.mn-pbox{width:min(560px,100%);background:var(--card);border-radius:16px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);overflow:hidden;border:1px solid var(--line)}
.mn-pbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font:inherit;font-size:16px;background:transparent;color:var(--ink);outline:0}
.mn-pl{max-height:50vh;overflow:auto;padding:6px}
.mn-pl .mn-i{height:44px}
.mn-pl .mn-i small{color:var(--faint);font-size:12.5px;margin-left:auto;white-space:nowrap}
@media(max-width:1023px){.mn-pal{padding:0;align-items:stretch}.mn-pbox{width:100%;border-radius:0;border:0}.mn-pl{max-height:none}}
</style>
</head>

  document.title=x[1]+" · Menu mock";
}
var $=function(i){return document.getElementById(i)};
function lock(on){document.documentElement.classList.toggle("mn-lock",on)}
function sheet(kind){
  var g=kind==="sites"?[M[1]]:M.filter(function(g,i){return i!==1&&i!==0});
  $("sheet").innerHTML='<div class="mn-grab"></div><div class="mn-sh"><b>'+(kind==="sites"?"Websites":"Menu")+'</b><button class="mn-btn" data-close aria-label="Close">'+ic("x")+'</button></div>'+menu(g,true).replace(/^<div class="mn-h">Websites<\/div>/,"");
  $("sheet").classList.add("on");$("bg").classList.add("on");lock(true);$("sheet").scrollTop=0;
}
function closeAll(){$("sheet").classList.remove("on");$("bg").classList.remove("on");$("pal").classList.remove("on");lock(false)}
function go(id){cur=id;try{history.replaceState(null,"","#"+id)}catch(e){}closeAll();paint();window.scrollTo(0,0)}
document.addEventListener("click",function(e){
  var a=e.target.closest("[data-id]");if(a){e.preventDefault();go(a.dataset.id);return}
  var t=e.target.closest("[data-t]");if(t){var k=t.dataset.t;if(k==="home")go("home");else if(k==="find")pal();else sheet(k);return}
  if(e.target.closest("[data-close]")||e.target===$("bg")||e.target===$("pal"))closeAll();
});
function pal(){$("pal").classList.add("on");lock(true);$("pq").value="";list("");setTimeout(function(){$("pq").focus()},30)}
function list(q){q=q.toLowerCase();$("pl").innerHTML=ALL.filter(function(a){return !q||(a[0][1]+" "+a[0][3]+" "+a[1]).toLowerCase().indexOf(q)>-1}).map(function(a){var x=a[0];return '<a class="mn-i" href="#'+x[0]+'" data-id="'+x[0]+'">'+vis(x)+'<span>'+x[1]+'</span><small>'+a[1]+'</small></a>'}).join("")||'<p style="padding:14px;color:var(--faint)">No page found</p>'}
$("q").onclick=pal;$("pq").oninput=function(){list(this.value)};
$("pq").onkeydown=function(e){if(e.key==="Enter"){var f=$("pl").querySelector("[data-id]");if(f)go(f.dataset.id)}};
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();pal()}if(e.key==="Escape")closeAll()});
function dkIcon(){var d=document.documentElement.classList.contains("adm-dark");$("dk").innerHTML=d?ic("sun"):ic("moon")}
$("dk").onclick=function(){var R=document.documentElement,d=R.classList.toggle("adm-dark");try{localStorage.setItem("hv-adm-theme",d?"dark":"light")}catch(e){}dkIcon()};
paint();dkIcon();
</script>
