var pill=w&&r[6]&&o?'<span class="mp dg">DANGER</span>':(w&&!o?'<span class="mp n">OFF</span>':'');
var facts='<div class="fct"><span><b>When</b> '+e(r[5])+'</span>'+(w?'<span><b>To</b> '+names(id)+'</span>':'')+(LS[id]?'<span><b>Last mail</b> '+e(LS[id])+'</span>':'')+'</div>';
var acts='<div class="acts">'+(w?'<button class="btn ghost" data-test="'+id+'" type="button">Send test to me</button>':'')+(r[9]?'<a class="btn ghost" href="'+r[9]+'">Open in '+e(r[10])+' &#8599;</a>':'')+'</div>';
return '<div class="glass apage mrow'+(o?"":" off")+(open?" open":"")+'" data-id="'+id+'" style="--i:'+ix+'"><div class="mh" data-op="'+id+'"><span class="ai g'+(gi%4)+'">'+ic(r[2])+'</span><div class="mt"><b>'+e(r[3])+pill+'</b><small>'+e(r[4])+'</small></div><div class="mc">'+ctl+'<svg class="chv" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div></div><div class="mx"><div class="mxi"><div class="mxb">'+facts+(w?whoBox(r):"")+acts+'</div></div></div></div>'}
function drawMails(){var today_=today(),due=CF.people.filter(function(p){return p.plan&&p.planDate&&p.planDate<=today_});
$("dueBox").innerHTML=due.map(function(p){return '<div class="due"><b>'+e(p.n)+': trial ended. Planned role: '+e(RO[p.plan])+'.</b><button class="btn" data-up="'+e(p.e)+'" type="button">Make '+e(RO[p.plan])+'</button><button class="btn ghost" data-keep="'+e(p.e)+'" type="button">Keep as Team</button></div>'}).join("");
var h="",ix=0;GROUPS.forEach(function(g,gi){var rows=CAT.filter(function(r){return r[1]===g&&(!st.q||(r[3]+r[4]+r[1]).toLowerCase().indexOf(st.q)>=0)});if(!rows.length)return;h+='<h3 class="gh">'+e(g)+'</h3><div class="mlist">'+rows.map(function(r){return rowHtml(r,ix++,gi)}).join("")+'</div>'});
var L=$("list");L.className=ANIM?"an":"";if(ANIM&&!ANIM_T){ANIM_T=setTimeout(function(){ANIM=false;ANIM_T=0},900)}
L.innerHTML=h||'<p class="empty">Nothing matches.</p>'}
function drawPpl(){var h='<div class="glass panel"><div style="font-weight:700;margin-bottom:2px">Who gets which mail, by role</div><div style="color:var(--soft);font-size:14px;margin-bottom:10px">Tap a box to change it for everyone with that role.</div><div style="overflow-x:auto"><table class="tbl"><tr><th>Mail</th>'+ROK.map(function(r){return '<th>'+RO[r]+'</th>'}).join("")+'</tr>'+CAT.filter(function(c){return c[8]===2}).map(function(c){return '<tr><td>'+e(c[3])+'</td>'+ROK.map(function(r){var o=roles(c[0]).indexOf(r)>=0,lock=c[6]&&r==="owner";return '<td><button class="cb'+(o?" on":"")+'" data-rm="'+c[0]+'|'+r+'"'+(lock?" disabled":"")+' aria-label="'+RO[r]+'" type="button">&#10003;</button></td>'}).join("")+'</tr>'}).join("")+'</table></div></div>';
h+='<h3 class="gh">People</h3>'+CF.people.map(function(p,i){var pl=p.plan?' &middot; Planned: '+e(RO[p.plan])+' on '+e(p.planDate||""):'';return '<div class="glass panel"><div class="pr"><div class="av">'+e(p.n[0])+'</div><div class="who"><b>'+e(p.n)+'</b><span>'+e(p.e)+pl+'</span></div><select data-role="'+i+'" aria-label="Role">'+ROK.map(function(r){return '<option value="'+r+'"'+(p.role===r?" selected":"")+'>'+RO[r]+'</option>'}).join("")+'</select>'+(p.role==="owner"?'':'<button class="btn ghost" data-del="'+i+'" type="button">Remove</button>')+'</div></div>'}).join("");
h+='<h3 class="gh">Add a person</h3><div class="glass panel"><div class="add"><input id="np_n" placeholder="Name" aria-label="Name"><input id="np_e" placeholder="name@haritt.com" aria-label="Email"><select id="np_r" aria-label="Role">'+ROK.filter(function(r){return r!=="owner"}).map(function(r){return '<option value="'+r+'"'+(r==="trial"?" selected":"")+'>'+RO[r]+'</option>'}).join("")+'</select><select id="np_p" aria-label="Planned role"><option value="">Planned role: none</option><option value="cofounder">Planned: Co-founder</option><option value="team">Planned: Team</option></select><input id="np_d" type="date" title="Trial ends on" aria-label="Trial ends on" class="full"><button class="btn full" id="np_a" type="button">Add person</button></div><p class="hint" style="margin-top:10px">Only @haritt.com addresses. For a trial, set the planned role and the date it ends. On that day a card asks you to confirm.</p></div>';
$("v2").innerHTML=h}
function drawMore(){var X=[["Write an email","Send a mail as yourself from your own @haritt.com address.","/admin/mail/","send"],["Sent mails","Every mail that went out, and whether it was opened.","/admin/mail/","at"],["Email addresses","Create, turn off and remove @haritt.com addresses.","/admin/addresses/","at"],["Marketing","Campaigns and intro mails to a list.","/admin/marketing/","gift"],["Onboarding","Joining mails, applications and agreements.","/admin/join/","user"],["Expiry and system status","Domains, tokens and the health of every job.","/admin/expiry/","warn"]];
$("v3").innerHTML='<div class="apages mlist" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))!important">'+X.map(function(x,i){return '<a class="glass apage" href="'+x[2]+'" style="--i:'+i+'"><span class="ai g'+(i%4)+'">'+ic(x[3])+'</span><span><b>'+e(x[0])+'</b><small>'+e(x[1])+'</small></span></a>'}).join("")+'</div>'}
document.addEventListener("click",function(x){
var tb=x.target.closest(".mtab");if(tb){st.tab=tb.dataset.t;document.querySelectorAll(".mtab").forEach(function(b){b.classList.toggle("on",b===tb)});$("v1").hidden=st.tab!=="mails";$("v2").hidden=st.tab!=="ppl";$("v3").hidden=st.tab!=="more";draw();return}
var op=x.target.closest("[data-op]");if(op&&!x.target.closest("label,a,button,input")){var id=op.dataset.op;st.open[id]=!st.open[id];op.parentNode.classList.toggle("open",st.open[id]);return}
var rm=x.target.closest("[data-rm]");if(rm&&!rm.disabled){var a=rm.dataset.rm.split("|"),cur=roles(a[0]).slice(),i=cur.indexOf(a[1]);if(i>=0)cur.splice(i,1);else cur.push(a[1]);CF.roleMap[a[0]]=cur;save();draw()}
var ts=x.target.closest("[data-test]");if(ts){sendTest(ts)}
var up=x.target.closest("[data-up]");if(up){CF.people.forEach(function(p){if(p.e===up.dataset.up){p.role=p.plan;delete p.plan;delete p.planDate}});save();draw();toast("Role changed")}
var kp=x.target.closest("[data-keep]");if(kp){CF.people.forEach(function(p){if(p.e===kp.dataset.keep){p.role="team";delete p.plan;delete p.planDate}});save();draw();toast("Kept as Team")}
var dl=x.target.closest("[data-del]");if(dl){var p=CF.people[+dl.dataset.del];if(confirm("Remove "+p.n+"?")){CF.people.splice(+dl.dataset.del,1);save();draw()}}
if(x.target.id==="np_a"){var em=$("np_e").value.toLowerCase().trim(),nm=$("np_n").value.trim();if(!nm||!/^[^@\s]+@haritt\.com$/.test(em)){toast("Use a name and an @haritt.com address");return}if(CF.people.some(function(p){return p.e===em})){toast("Already added");return}var np={e:em,n:nm,role:$("np_r").value};if($("np_p").value&&$("np_d").value){np.plan=$("np_p").value;np.planDate=$("np_d").value}CF.people.push(np);save();draw();toast("Added")}});
document.addEventListener("change",function(x){var t=x.target;
if(t.dataset.pu){var a=t.dataset.pu.split("|");CF.mute[a[0]]=CF.mute[a[0]]||{};if(t.value&&t.value>today()){CF.mute[a[0]][a[1]]=t.value;toast("Paused until "+t.value)}else{delete CF.mute[a[0]][a[1]];toast("Pause cleared")}save();draw();return}
if(t.dataset.sw){CF.sw[t.dataset.sw]=t.checked;save();var row=t.closest(".mrow");if(row)row.classList.toggle("off",!t.checked);setTimeout(function(){stats();var s=byId(t.dataset.sw);var mt=row&&row.querySelector(".mt b");if(mt){var p=mt.querySelector(".mp");if(p)p.remove();if(!t.checked)mt.insertAdjacentHTML("beforeend",'<span class="mp n">OFF</span>');else if(s[6])mt.insertAdjacentHTML("beforeend",'<span class="mp dg">DANGER</span>')}},0);return}
if(t.dataset.pp){var a=t.dataset.pp.split("|"),id=a[0],em=a[1],rs=roles(id),inr=rs.indexOf(CF.people.filter(function(p){return p.e===em})[0].role)>=0;CF.mute[id]=CF.mute[id]||{};CF.add[id]=CF.add[id]||[];if(t.checked){delete CF.mute[id][em];if(!inr&&CF.add[id].indexOf(em)<0)CF.add[id].push(em)}else{if(inr)CF.mute[id][em]="forever";else CF.add[id]=CF.add[id].filter(function(z){return z!==em})}save();draw()}
if(t.dataset.role!=null){CF.people[+t.dataset.role].role=t.value;save();draw();toast("Role changed")}});
$("q").addEventListener("input",function(x){st.q=x.target.value.toLowerCase();ANIM=false;draw()});
function boot(){if(!(window.firebase&&firebase.apps&&firebase.apps.length)){setTimeout(boot,150);return}auth=firebase.auth();try{AP=firebase.appCheck()}catch(x){AP=null}auth.onAuthStateChanged(function(u){if(u){U=u;load()}})}
setTimeout(function(){if(!DRAWN)draw()},1800);boot()})();
</script></body></html>
