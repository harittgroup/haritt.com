<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reminders · design preview</title>
<style>
:root{--ink:#1E1B16;--soft:#6B645A;--faint:#8C8579;--line:#EAE3D8;--accent:#A8434C;--accbg:#F7ECEA;--accln:#E8C9C9;--ok:#1F8F5F;--okbg:#E4F4EC;--warn:#9A6A12;--warnbg:#FBF0D6;--bad:#B42318;--badbg:#FCE9E7;--bg:#FAF7F2;--card:#fff;--sb:#F3EEE6;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light}
html.dk{--ink:#ECEEF1;--soft:#A3A9B5;--faint:#7C8390;--line:#262A31;--accent:#E08A91;--accbg:#2A1D20;--accln:#4A2E33;--ok:#3DD598;--okbg:#10261E;--warn:#F5B63D;--warnbg:#2A2210;--bad:#FF8A84;--badbg:#2A1517;--bg:#0E0F12;--card:#16181D;--sb:#121419;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--line);font-weight:700}.top small{color:var(--faint);font-weight:500}.top button{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:30px 20px 100px}
h1{font-size:30px;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--soft);margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.st b{display:block;font-size:26px;letter-spacing:-.02em}.st span{font-size:13px;color:var(--soft)}.st.g b{color:var(--ok)}.st.r b{color:var(--bad)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.search{flex:1;min-width:200px;position:relative}.search input{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 38px;font:inherit}.search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accbg)}.search svg{position:absolute;left:12px;top:12px;width:16px;height:16px;color:var(--faint)}
.seg{display:flex;background:var(--sb);border-radius:12px;padding:3px}.seg button{border:0;background:none;color:var(--soft);padding:7px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.chip{border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:99px;padding:6px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:.15s var(--ease)}.chip.on{background:var(--accbg);color:var(--accent);border-color:var(--accln)}.chip b{margin-left:6px;opacity:.6;font-weight:600}
.grp{margin:26px 0 10px;display:flex;align-items:center;gap:10px}.grp h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0}.grp i{flex:1;height:1px;background:var(--line)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;transition:.2s var(--ease)}.row:hover{border-color:var(--accln)}.row.off{opacity:.62}
.ic{width:44px;height:44px;border-radius:12px;background:var(--accbg);color:var(--accent);display:grid;place-items:center}.ic svg{width:22px;height:22px}.row.danger .ic{background:var(--badbg);color:var(--bad)}
.t{font-weight:700;font-size:16px}.d{color:var(--soft);font-size:14px;margin-top:2px}.m{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--faint)}.m b{color:var(--soft);font-weight:600}
.pill{font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:99px;background:var(--okbg);color:var(--ok);margin-left:8px;vertical-align:2px}.row.off .pill{background:var(--sb);color:var(--faint)}.pill.dg{background:var(--badbg);color:var(--bad)}
.ctl{display:flex;flex-direction:column;align-items:flex-end;gap:10px}.tg{position:relative;width:48px;height:28px}.tg input{display:none}.tg span{position:absolute;inset:0;background:var(--line);border-radius:99px;cursor:pointer;transition:background .2s var(--ease)}.tg span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}.tg input:checked+span{background:var(--ok)}.tg input:checked+span::after{transform:translateX(20px)}
.test{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.test:hover{border-color:var(--accent);color:var(--accent)}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:18px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:40px 1fr}.ctl{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}.ic{width:40px;height:40px}}
</style></head><body>
<div class="top">Haritt Admin <small>· Reminders · design preview</small><button id="th">Dark</button></div>
<div class="wrap"><h1>Reminders</h1><p class="sub">Everything that sends you or your team a reminder, in one place. Switch any of them on or off.</p>
<div class="note">Preview only. Switches here do not save yet. Items and schedules are real.</div>
<div class="stats"><div class="st g"><b id="sOn">0</b><span>Reminders on</span></div><div class="st"><b id="sOff">0</b><span>Switched off</span></div><div class="st r"><b id="sDg">0</b><span>Danger mails</span></div><div class="st"><b>Today</b><span>Next check 9:00 AM IST</span></div></div>
<div class="tools"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search reminders"></div><div class="seg" id="seg"><button class="on" data-s="all">All</button><button data-s="on">On</button><button data-s="off">Off</button></div></div>
<div class="chips" id="chips"></div><div id="list"></div></div>
<script>
var I={clock:'<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 8-8m-3 3 3 3"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',warn:'<path d="M12 4 3 20h18z"/><path d="M12 10v4m0 3v.01"/>',chart:'<path d="M4 20V10m6 10V4m6 16v-7"/>'};
var R=[
["Expiry","globe","Domain haritt.com","Mail 60 days before, then every day from 30 days until renewed. Danger style.","Expires 7 Oct 2027","To you only","danger",1],
["Expiry","globe","Domain thehvverse.com","Mail 60 days before, then every day from 30 days until renewed. Danger style.","Expires 18 Oct 2027","To you only","danger",1],
["Expiry","key","GitHub token: changelog (haritt.com)","Danger mail at 60 days, daily from 30 days.","Expires 21 Nov 2027","To you only","danger",1],
["Expiry","key","GitHub token: changelog (developers)","Danger mail at 60 days, daily from 30 days.","Expires 22 Nov 2027","To you only","danger",1],
["Expiry","key","Cloudflare API token","Danger mail if it is invalid or has an expiry date.","No expiry set","To you only","danger",1],
["E-sign","pen","Joining agreement: sign reminder","Reminds the member, then the founders, in steps. Stops and tells the team if still unsigned.","9 AM to 9 PM IST","Member, then team","",1],
["E-sign","pen","Developers e-sign: sign reminder","After 2 days, then every 2 days, up to 4 times. Overdue mail after the sign-by date.","Daily at 9 AM IST","Signers, overdue to you","",1],
["Meetings","cal","Client meeting reminder","24 hours and 1 hour before every confirmed meeting. One nudge to the manager if nobody said what happened.","Every 30 minutes","Client, manager","",1],
["Chat","chat","Unanswered client message","First reminder after 1 hour, then every 4 hours, up to 3 times. Short thanks like ok are ignored.","9 AM to 9 PM IST","Team","",1],
["Problem alerts","warn","Site down, job failed, script not responding","One mail when a problem appears. Also DMARC, Resend and SSL problems.","Twice a day","To you only","danger",1],
["Reports","chart","Weekly report (new)","Monday summary: visitors, Google clicks, problems, what expires soon.","Monday 9 AM IST","To you only","",0]];
var st={f:"all",c:"All",q:""},L=document.getElementById("list");
function draw(){var cats=["All"].concat(R.map(function(r){return r[0]}).filter(function(v,i,a){return a.indexOf(v)===i}));
document.getElementById("chips").innerHTML=cats.map(function(c){var n=R.filter(function(r){return c==="All"||r[0]===c}).length;return '<button class="chip'+(st.c===c?" on":"")+'" data-c="'+c+'">'+c+'<b>'+n+'</b></button>'}).join("");
var h="",last="";R.forEach(function(r,i){if(st.c!=="All"&&r[0]!==st.c)return;if(st.f==="on"&&!r[7])return;if(st.f==="off"&&r[7])return;if(st.q&&(r[2]+r[3]+r[0]).toLowerCase().indexOf(st.q)<0)return;
if(r[0]!==last){h+='<div class="grp"><h2>'+r[0]+'</h2><i></i></div>';last=r[0]}
h+='<div class="row'+(r[7]?"":" off")+(r[6]?" danger":"")+'"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+I[r[1]]+'</svg></div><div><div class="t">'+r[2]+'<span class="pill'+(r[6]&&r[7]?" dg":"")+'">'+(r[7]?(r[6]?"DANGER":"ON"):"OFF")+'</span></div><div class="d">'+r[3]+'</div><div class="m"><span><b>When</b> '+r[4]+'</span><span><b>To</b> '+r[5]+'</span><span><b>Last sent</b> never</span></div></div><div class="ctl"><label class="tg"><input type="checkbox" data-i="'+i+'"'+(r[7]?" checked":"")+'><span></span></label><button class="test">Send test to me</button></div></div>'});
L.innerHTML=h||'<p style="color:var(--soft)">Nothing matches.</p>';
var on=R.filter(function(r){return r[7]}).length;document.getElementById("sOn").textContent=on;document.getElementById("sOff").textContent=R.length-on;document.getElementById("sDg").textContent=R.filter(function(r){return r[6]&&r[7]}).length}
document.addEventListener("click",function(e){var c=e.target.closest(".chip");if(c){st.c=c.dataset.c;draw()}var s=e.target.closest("#seg button");if(s){st.f=s.dataset.s;document.querySelectorAll("#seg button").forEach(function(b){b.classList.toggle("on",b===s)});draw()}});
document.addEventListener("change",function(e){if(e.target.dataset.i!=null){R[e.target.dataset.i][7]=e.target.checked?1:0;setTimeout(draw,180)}});
document.getElementById("q").addEventListener("input",function(e){st.q=e.target.value.toLowerCase();draw()});
document.getElementById("th").onclick=function(){var d=document.documentElement.classList.toggle("dk");this.textContent=d?"Light":"Dark"};
draw();
</script></body></html>
