var RO={owner:"Owner",cofounder:"Co-founder",team:"Team",trial:"Trial"},ROK=["owner","cofounder","team","trial"];
/* id, category, icon, title, text, when, danger, default roles, wired: 2 = who+switch, 1 = switch only */
var CAT=[
["expiry_domain","Expiry","globe","Domain renewals","Domains (haritt.com, thehvverse.com). First mail at 60 days, then every day from 30 days.","Daily check",1,["owner"],2],
["expiry_github","Expiry","key","GitHub access tokens","Changelog tokens. First mail at 60 days, then every day from 30 days.","Daily check",1,["owner"],2],
["expiry_cf","Expiry","key","Cloudflare token","Mail if the token is invalid or has an expiry date.","Daily check",1,["owner"],2],
["esign_join","E-sign","pen","Joining agreement: sign reminder","Reminds the member, then the founders, in steps. Tells the team if still unsigned.","9 AM to 9 PM IST",0,["owner","cofounder"],1],
["esign_dev","E-sign","pen","Developers e-sign: sign reminder","After 2 days, then every 2 days, up to 4 times. Overdue mail after the sign-by date.","Daily at 9 AM IST",0,["owner"],1],
["meet","Meetings","cal","Client meeting reminder","24 hours and 1 hour before every confirmed meeting.","Every 30 minutes",0,["owner"],1],
["chat","Chat","chat","Unanswered client message","First reminder after 1 hour, then every 4 hours, up to 3 times.","9 AM to 9 PM IST",0,["owner","cofounder"],1],
["alerts","Problem alerts","warn","Site down, job failed, script not responding","One mail when a problem appears. Also DMARC, Resend and SSL problems.","Twice a day",1,["owner","cofounder"],2]];
var CF={sw:{},roleMap:{},mute:{},add:{},people:[{e:"harsh.goyal@haritt.com",n:"Harsh",role:"owner"},{e:"pulkit.soni@haritt.com",n:"Pulkit",role:"cofounder"}]};
var U=null,AP=null,auth=null,st={f:"all",c:"All",q:"",tab:"rem",open:{}},saveT=null,dirty=false;
function toast(m){var t=$("toast");t.textContent=m;t.className="toast show";clearTimeout(toast._t);toast._t=setTimeout(function(){t.className="toast"},2200)}
async function hdr(){var h={Authorization:"Bearer "+await auth.currentUser.getIdToken(),"Content-Type":"application/json"};if(AP){try{var t=await AP.getToken(false);if(t&&t.token)h["X-Firebase-AppCheck"]=t.token}catch(x){}}return h}
async function load(){try{var r=await fetch(DOCS+"/"+KEY+"/main?key="+AK,{headers:await hdr(),cache:"no-store"});if(r.ok){var d=await r.json(),j=JSON.parse((d.fields&&d.fields.json&&d.fields.json.stringValue)||"{}");CF=Object.assign({sw:{},roleMap:{},mute:{},add:{},people:CF.people},j)}}catch(x){}draw()}
async function save(){dirty=true;clearTimeout(saveT);saveT=setTimeout(async function(){var f=DOCS+"/"+KEY+"/main?key="+AK+"&updateMask.fieldPaths=json&updateMask.fieldPaths=updatedAt&updateMask.fieldPaths=by";try{var r=await fetch(f,{method:"PATCH",headers:await hdr(),body:JSON.stringify({fields:{json:{stringValue:JSON.stringify(CF)},updatedAt:{stringValue:new Date().toISOString()},by:{stringValue:U&&U.email||""}}})});if(r.ok){dirty=false;toast("Saved")}else toast("Could not save ("+r.status+")")}catch(x){toast("Could not save")}},400)}
function on(id){return CF.sw[id]!==false}
function roles(id){var c=CAT.filter(function(x){return x[0]===id})[0];return CF.roleMap[id]||c[7]}
function muted(id,em){var m=(CF.mute[id]||{})[em];if(!m)return false;return m==="forever"||m>new Date().toISOString().slice(0,10)}
function recip(id){var c=CAT.filter(function(x){return x[0]===id})[0],rs=roles(id),out=[];CF.people.forEach(function(p){var inr=rs.indexOf(p.role)>=0||(CF.add[id]||[]).indexOf(p.e)>=0;if(!inr)return;if(muted(id,p.e)&&!(c[6]&&p.role==="owner"))return;out.push(p)});return out}
function names(id){var r=recip(id);return r.length?r.map(function(p){return e(p.n)}).join(", "):"Nobody"}
function draw(){if(st.tab==="rem")drawRem();else drawPpl();var n=CAT.filter(function(c){return on(c[0])}).length;$("sOn").textContent=n;$("sOff").textContent=CAT.length-n;$("sDg").textContent=CAT.filter(function(c){return c[6]&&on(c[0])}).length;$("sPe").textContent=CF.people.length}
function drawRem(){var cats=["All"].concat(CAT.map(function(r){return r[1]}).filter(function(v,i,a){return a.indexOf(v)===i}));
$("chips").innerHTML=cats.map(function(c){var n=CAT.filter(function(r){return c==="All"||r[1]===c}).length;return '<button class="chip'+(st.c===c?" on":"")+'" data-c="'+c+'">'+c+'<b>'+n+'</b></button>'}).join("");
var today=new Date().toISOString().slice(0,10),due=CF.people.filter(function(p){return p.plan&&p.planDate&&p.planDate<=today});
$("dueBox").innerHTML=due.map(function(p){return '<div class="due"><b>'+e(p.n)+': trial ended. Planned role: '+e(RO[p.plan])+'.</b><button class="go" data-up="'+e(p.e)+'">Make '+e(RO[p.plan])+'</button><button class="go g" data-keep="'+e(p.e)+'">Keep as Team</button></div>'}).join("");
var h="",last="";CAT.forEach(function(r){var id=r[0];if(st.c!=="All"&&r[1]!==st.c)return;if(st.f==="on"&&!on(id))return;if(st.f==="off"&&on(id))return;if(st.q&&(r[3]+r[4]+r[1]).toLowerCase().indexOf(st.q)<0)return;
if(r[1]!==last){h+='<div class="grp"><h2>'+r[1]+'</h2><i></i></div>';last=r[1]}
var o=on(id);h+='<div class="row'+(o?"":" off")+(r[6]?" danger":"")+(st.open[id]?" open":"")+'"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+I[r[2]]+'</svg></div><div class="body"><div class="t">'+r[3]+'<span class="pill'+(r[6]&&o?" dg":"")+'">'+(o?(r[6]?"DANGER":"ON"):"OFF")+'</span></div><div class="d">'+r[4]+'</div><div class="m"><span><b>When</b> '+r[5]+'</span><span><b>To</b> '+(r[8]===2?names(id):"As before")+'</span>'+(r[8]===2?' <button class="lnk" data-op="'+id+'">'+(st.open[id]?"Hide":"Who gets it")+'</button>':'<span class="fixd">Recipients set in the script</span>')+'</div>'+(r[8]===2&&st.open[id]?recBox(id,r):"")+'</div><div class="ctl"><label class="tg"><input type="checkbox" data-sw="'+id+'"'+(o?" checked":"")+'><span></span></label></div></div>'});
$("list").innerHTML=h||'<p style="color:var(--soft)">Nothing matches.</p>'}
function recBox(id,r){var rs=roles(id),h='<div class="rec"><div style="font-size:13px;color:var(--soft);margin-bottom:6px">By role: '+rs.map(function(x){return RO[x]}).join(", ")+'. Turn a person off to mute this reminder for them. '+(r[6]?'The Owner always gets danger mails.':'')+'</div>';
CF.people.forEach(function(p){var inr=rs.indexOf(p.role)>=0||(CF.add[id]||[]).indexOf(p.e)>=0,mu=muted(id,p.e),own=r[6]&&p.role==="owner",ok=own||(inr&&!mu);var why=own?"always, danger mail":inr?(mu?"muted by you":((CF.add[id]||[]).indexOf(p.e)>=0&&rs.indexOf(p.role)<0?"added by you":"by role")):"not in this reminder";
h+='<div class="pp"><div class="av" style="width:32px;height:32px;font-size:13px">'+e(p.n[0])+'</div><div class="who"><b>'+e(p.n)+'</b><span>'+e(RO[p.role])+' &middot; '+why+'</span></div>'+(!own&&mu&&CF.mute[id][p.e]!=="forever"?'<span class="fixd">until '+e(CF.mute[id][p.e])+'</span>':'')+'<label class="tg"><input type="checkbox" data-pp="'+id+'|'+e(p.e)+'"'+(ok?" checked":"")+(own?" disabled":"")+'><span></span></label></div>'});
return h+'<div style="margin-top:8px"><button class="lnk" data-until="'+id+'">Mute until a date instead</button></div></div>'}
function drawPpl(){var h='<div class="pcard"><div style="font-weight:700;margin-bottom:4px">Who gets what, by role</div><div style="color:var(--soft);font-size:14px;margin-bottom:10px">Tap a box to change it for everyone with that role.</div><div style="overflow-x:auto"><table class="tbl"><tr><th>Reminder</th>'+ROK.map(function(r){return '<th>'+RO[r]+'</th>'}).join("")+'</tr>'+CAT.filter(function(c){return c[8]===2}).map(function(c){return '<tr><td>'+c[3]+'</td>'+ROK.map(function(r){var o=roles(c[0]).indexOf(r)>=0,lock=c[6]&&r==="owner";return '<td><button class="cb'+(o?" on":"")+'" data-rm="'+c[0]+'|'+r+'"'+(lock?" disabled":"")+'>&#10003;</button></td>'}).join("")+'</tr>'}).join("")+'</table></div></div>';
h+='<div class="grp"><h2>People</h2><i></i></div>'+CF.people.map(function(p,i){var pl=p.plan?'Planned: '+e(RO[p.plan])+' on '+e(p.planDate||""):'';return '<div class="pcard"><div class="pr"><div class="av">'+e(p.n[0])+'</div><div class="who"><b>'+e(p.n)+'</b><span>'+e(p.e)+(pl?' &middot; '+pl:'')+'</span></div><select data-role="'+i+'">'+ROK.map(function(r){return '<option value="'+r+'"'+(p.role===r?" selected":"")+'>'+RO[r]+'</option>'}).join("")+'</select>'+(p.role==="owner"?'':'<button class="go g" data-del="'+i+'">Remove</button>')+'</div></div>'}).join("");
h+='<div class="pcard"><div style="font-weight:700;margin-bottom:8px">Add a person</div><div class="pr"><input class="in" id="np_n" placeholder="Name"><input class="in" id="np_e" placeholder="name@haritt.com" style="min-width:220px"><select id="np_r">'+ROK.filter(function(r){return r!=="owner"}).map(function(r){return '<option value="'+r+'"'+(r==="trial"?" selected":"")+'>'+RO[r]+'</option>'}).join("")+'</select><select id="np_p"><option value="">Planned role: none</option><option value="cofounder">Planned: Co-founder</option><option value="team">Planned: Team</option></select><input class="in" id="np_d" type="date" title="Trial ends on"><button class="go" id="np_a">Add</button></div><div style="font-size:12px;color:var(--faint);margin-top:8px">Only @haritt.com addresses. For a trial, set the planned role and the date it ends. On that day a card asks you to confirm.</div></div>';
$("v2").innerHTML=h}
document.addEventListener("click",function(x){var t=x.target.closest("[data-c]");if(t&&t.classList.contains("chip")){st.c=t.dataset.c;draw()}
var s=x.target.closest("#seg button");if(s){st.f=s.dataset.s;document.querySelectorAll("#seg button").forEach(function(b){b.classList.toggle("on",b===s)});draw()}
var tb=x.target.closest(".tab");if(tb){st.tab=tb.dataset.t;document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b===tb)});$("v1").hidden=st.tab!=="rem";$("v2").hidden=st.tab!=="ppl";draw()}
var op=x.target.closest("[data-op]");if(op){st.open[op.dataset.op]=!st.open[op.dataset.op];draw()}
var rm=x.target.closest("[data-rm]");if(rm&&!rm.disabled){var a=rm.dataset.rm.split("|"),cur=roles(a[0]).slice(),i=cur.indexOf(a[1]);if(i>=0)cur.splice(i,1);else cur.push(a[1]);CF.roleMap[a[0]]=cur;save();draw()}
var un=x.target.closest("[data-until]");if(un){var d=prompt("Mute until which date? (YYYY-MM-DD)");if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return;var who=prompt("Mute for whom? Type the person's email");if(!who)return;CF.mute[un.dataset.until]=CF.mute[un.dataset.until]||{};CF.mute[un.dataset.until][who.toLowerCase().trim()]=d;save();draw()}
var up=x.target.closest("[data-up]");if(up){CF.people.forEach(function(p){if(p.e===up.dataset.up){p.role=p.plan;delete p.plan;delete p.planDate}});save();draw();toast("Role changed")}
var kp=x.target.closest("[data-keep]");if(kp){CF.people.forEach(function(p){if(p.e===kp.dataset.keep){p.role="team";delete p.plan;delete p.planDate}});save();draw();toast("Kept as Team")}
var dl=x.target.closest("[data-del]");if(dl){var p=CF.people[+dl.dataset.del];if(confirm("Remove "+p.n+"?")){CF.people.splice(+dl.dataset.del,1);save();draw()}}
if(x.target.id==="np_a"){var em=$("np_e").value.toLowerCase().trim(),nm=$("np_n").value.trim();if(!nm||!/^[^@\s]+@haritt\.com$/.test(em)){toast("Use a name and an @haritt.com address");return}if(CF.people.some(function(p){return p.e===em})){toast("Already added");return}var np={e:em,n:nm,role:$("np_r").value};if($("np_p").value&&$("np_d").value){np.plan=$("np_p").value;np.planDate=$("np_d").value}CF.people.push(np);save();draw();toast("Added")}});
document.addEventListener("change",function(x){var t=x.target;if(t.dataset.sw){CF.sw[t.dataset.sw]=t.checked;save();setTimeout(draw,160)}
if(t.dataset.pp){var a=t.dataset.pp.split("|"),id=a[0],em=a[1],rs=roles(id),inr=rs.indexOf(CF.people.filter(function(p){return p.e===em})[0].role)>=0;CF.mute[id]=CF.mute[id]||{};CF.add[id]=CF.add[id]||[];if(t.checked){delete CF.mute[id][em];if(!inr&&CF.add[id].indexOf(em)<0)CF.add[id].push(em)}else{if(inr)CF.mute[id][em]="forever";else CF.add[id]=CF.add[id].filter(function(z){return z!==em})}save();draw()}
if(t.dataset.role!=null){CF.people[+t.dataset.role].role=t.value;save();draw();toast("Role changed")}});
$("q").addEventListener("input",function(x){st.q=x.target.value.toLowerCase();draw()});
function boot(){if(!(window.firebase&&firebase.apps&&firebase.apps.length)){setTimeout(boot,150);return}auth=firebase.auth();try{AP=firebase.appCheck()}catch(x){AP=null}auth.onAuthStateChanged(function(u){if(u){U=u;load()}})}
draw();boot()})();
</script></body></html>
