<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Opening link · Haritt</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f4ef;color:#19181b;font:16px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:24px}a{color:#a70d22}</style>
</head>
<body>
<p id="m">Opening your link...</p>
<script>
/* Email link counter. The marketing emails link here as /r/?c=<campaign>&r=<recipient>&u=<address>. This saves one click
   (campaign, recipient token, address, time) in Firestore, then sends the person on. Only haritt.com addresses are followed. */
(function () {
  var q = new URLSearchParams(location.search), u = q.get("u") || "", c = (q.get("c") || "").slice(0, 30), r = (q.get("r") || "").slice(0, 20), go = "";
  try { var x = new URL(u); if (x.protocol === "https:" && (x.hostname === "haritt.com" || /\.haritt\.com$/.test(x.hostname) || x.hostname === "thehvverse.com")) go = x.href; } catch (e) {}
  if (!go) { location.replace("https://haritt.com/"); return; }
  document.getElementById("m").innerHTML = 'Opening your link... <a href="' + go.replace(/"/g, "%22") + '">Continue</a>';
  var done = false; function leave() { if (!done) { done = true; location.replace(go); } }
  setTimeout(leave, 1200);
  if (!/^[a-z0-9]{3,30}$/.test(c) || !/^[a-z0-9]{3,20}$/.test(r)) { leave(); return; }
  try {
    var name = "projects/harsh-reset/databases/(default)/documents/mailEvents/" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    fetch("https://firestore.googleapis.com/v1/projects/harsh-reset/databases/(default)/documents:commit?key=AIzaSyDggasAVdqpvamkn1xeex2NmPUqG9JiZJ4", {
      method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
      body: JSON.stringify({ writes: [{ update: { name: name, fields: { c: { stringValue: c }, r: { stringValue: r }, u: { stringValue: go.slice(0, 300) } } }, updateTransforms: [{ fieldPath: "at", setToServerValue: "REQUEST_TIME" }], currentDocument: { exists: false } }] })
    }).then(leave, leave);
  } catch (e) { leave(); }
})();
</script>
<noscript><p><a href="https://haritt.com/">Go to haritt.com</a></p></noscript>
</body>
</html>
