<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Set your inbox · Haritt Group</title><link rel="icon" href="/admin/haritt-icon.png" type="image/png">
<style>
:root{--ink:#1B1A1C;--soft:#64606A;--faint:#98939E;--line:#ECE8EE;--bg:#F6F4F7;--card:#fff;--acc:#A70D22;--accbg:#FBEDEF;--ok:#12805A;--amber:#8A5A00;--amberbg:#FFF6DC;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--ink:#F1EEF3;--soft:#B6B0BD;--faint:#8A8492;--line:#2B2830;--bg:#0E0F12;--card:#17161A;--acc:#E88A93;--accbg:#2A1B1E;--ok:#3DD598;--amber:#F1C65B;--amberbg:#2B2412}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 80px}.logo{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:26px}.logo img{width:30px;height:30px;border-radius:8px}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}.sub{color:var(--soft);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 24px 48px -34px rgba(60,20,40,.3)}
.addr{display:inline-block;background:var(--accbg);color:var(--acc);font-weight:700;border-radius:10px;padding:4px 12px;overflow-wrap:anywhere}
.steps{counter-reset:s;margin:18px 0;padding:0;list-style:none}.steps li{counter-increment:s;display:flex;gap:12px;margin-bottom:14px;color:var(--soft)}.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accbg);color:var(--acc);font-weight:700;font-size:13px;display:grid;place-items:center}.steps b{color:var(--ink)}.steps a{color:var(--acc);font-weight:600}
.cp{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:8px}.cp div{flex:1;min-width:0}.cp small{display:block;color:var(--faint);font-size:12px}.cp code{font:13.5px ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 14px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}.btn:hover{border-color:var(--acc);color:var(--acc)}.btn.p{background:var(--acc);color:#fff;border-color:var(--acc);padding:10px 18px;font-size:14px}[data-t=dark] .btn.p{color:#1B1A1C}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note{background:var(--amberbg);color:var(--amber);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-top:14px}.mini{display:block;font-size:13px;color:var(--faint)}.mini b{color:var(--soft)}.foot{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tip{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--soft);margin-top:14px}.err{text-align:center;padding:30px 10px}.err h2{margin:0 0 6px}.ft{margin-top:22px;color:var(--faint);font-size:12.5px;text-align:center}
.f{display:grid;gap:10px;margin-top:6px}.f input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px}.f input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}.f .btn.p{justify-content:center;width:100%}.f .btn:disabled{opacity:.6}.code{letter-spacing:.4em;text-align:center;font-size:22px!important;font-weight:700}.msg{font-size:13.5px;color:var(--acc);min-height:20px;margin-top:8px}.done{text-align:center;padding:10px 0}.done .tick{width:54px;height:54px;border-radius:50%;background:var(--accbg);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}.done .tick svg{width:26px;height:26px;stroke-width:2.4}.fade{animation:up .4s cubic-bezier(.2,.7,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.fade{animation:none}}
</style></head><body><div class="wrap"><div class="logo"><img src="/admin/haritt-icon.png" alt=""><span>Haritt Group</span></div><div id="app"><p class="sub">Loading…</p></div></div>
<script>
(function(){var A=document.getElementById("app"),API="https://haritt-inbox.harittgroup.workers.dev",esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var OK='<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',t=(new URLSearchParams(location.search).get("t")||"").trim(),addr="";
function call(b){b.t=t;return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function bad(h,m){A.innerHTML='<div class="card err fade"><h2>'+h+'</h2><p class="sub" style="margin:0">'+m+'</p></div>'}
function step1(msg){A.innerHTML='<div class="fade"><h1>Set your inbox</h1><p class="sub">Mail sent to <span class="addr">'+esc(addr)+'</span> will arrive in your own Gmail. About 20 seconds.</p><div class="card"><div class="f"><label for="g" class="mini"><b>Your Gmail</b></label><input id="g" type="email" inputmode="email" autocomplete="email" placeholder="you@gmail.com"><button class="btn p" id="go">Send me a code</button></div><div class="msg" id="m">'+(msg||"")+'</div><div class="tip">Only you see this Gmail. The team and other people never do.</div></div></div>';
 var g=document.getElementById("g"),b=document.getElementById("go"),m=document.getElementById("m");g.focus();
 function go(){var v=g.value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){m.textContent="Enter a valid email.";return}b.disabled=true;b.textContent="Sending…";call({action:"otp_send",gmail:v}).then(function(r){if(r&&r.ok)return step2(r.to);b.disabled=false;b.textContent="Send me a code";m.textContent=r&&r.error==="many"?"Too many tries. Ask for a new link.":r&&r.error==="gmail"?"Use your personal Gmail, not a Haritt address.":"Could not send. Try again."}).catch(function(){b.disabled=false;b.textContent="Send me a code";m.textContent="No connection. Try again."})}
 b.onclick=go;g.onkeydown=function(e){if(e.key==="Enter")go()}}
function step2(to){A.innerHTML='<div class="fade"><h1>Enter the code</h1><p class="sub">We sent a 6 digit code to <b>'+esc(to)+'</b>. It can take a minute.</p><div class="card"><div class="f"><input id="c" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"><button class="btn p" id="ok">Confirm</button></div><div class="msg" id="m"></div><div class="foot"><button class="btn" id="bk">Use a different Gmail</button></div></div></div>';
 var c=document.getElementById("c"),b=document.getElementById("ok"),m=document.getElementById("m");c.focus();document.getElementById("bk").onclick=function(){step1()};
 function chk(){var v=c.value.replace(/\D/g,"");if(v.length!==6){m.textContent="Enter the 6 digits.";return}b.disabled=true;call({action:"otp_check",code:v}).then(function(r){if(r&&r.ok)return done(r);b.disabled=false;m.textContent=r&&r.error==="many"?"Too many wrong codes. Ask for a new link.":r&&r.error==="expired"?"Code expired. Go back and ask for a new one.":"That code is not right."}).catch(function(){b.disabled=false;m.textContent="No connection. Try again."})}
 b.onclick=chk;c.oninput=function(){if(c.value.replace(/\D/g,"").length===6)chk()}}
function done(r){A.innerHTML='<div class="card done fade"><div class="tick">'+OK+'</div><h1 style="font-size:24px">You are all set</h1><p class="sub" style="margin:0 0 6px">Mail to <span class="addr">'+esc(r.addr)+'</span> now arrives in <b>'+esc(r.gmail)+'</b>.</p>'+(r.waiting?'<p class="sub" style="margin:0">'+r.waiting+' waiting mail'+(r.waiting>1?'s were':' was')+' delivered.</p>':"")+'</div>'}
if(!/^[0-9a-f]{32}$/.test(t)){bad("This link is not complete","Ask the person who sent it for a new one.");return}
call({action:"inv_get"}).then(function(r){if(!r||!r.ok){bad("This link has expired","Ask the person who sent it for a new link.");return}addr=r.addr;step1()}).catch(function(){bad("No connection","Check your internet and reload.")})})();
</script></body></html>
