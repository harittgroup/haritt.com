name: Weekly changelog
on:
  schedule:
    - cron: "30 18 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: changelog
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Screenshots
        run: |
          mkdir -p changelog/img
          npm i --no-save playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node .github/scripts/shots.js "$(date -u -d '+5 hours 30 minutes' +%G-w%V)" || true
      - name: Build entry
        id: c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_TOKEN: ${{ secrets.CHANGELOG_TOKEN }}
        run: python3 .github/scripts/changelog.py
      - name: Save
        run: |
          git config user.name "Haritt Bot"; git config user.email "bot@haritt.com"
          git add changelog
          git diff --cached --quiet || (git commit -m "Weekly changelog" && git pull --rebase -X theirs -q && git push)
