name: SEO auto
on:
  push:
    branches: [main]
    paths-ignore: ["seo/**", "admin/**", "status/**", "workers/**", "changelog/**"]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency: seo
jobs:
  seo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-auth requests
      - name: Add new pages to sitemap
        run: |
          python3 .github/scripts/sitemap_sync.py
          git config user.name "Haritt Bot"; git config user.email "bot@haritt.com"
          git add sitemap.xml
          git diff --cached --quiet || (git commit -m "Sitemap: add new pages" && git pull --rebase -X theirs -q && git push)
      - name: Google login (keyless)
        id: g
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/32485880655/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: seo-bot@haritt-seo.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/webmasters,https://www.googleapis.com/auth/indexing,https://www.googleapis.com/auth/analytics.readonly,https://www.googleapis.com/auth/androidpublisher
      - name: Submit sitemaps, inspect, ping IndexNow
        env:
          GSC_TOKEN: ${{ steps.g.outputs.access_token }}
          SA: ${{ secrets.GSC_SA_JSON || secrets.FIREBASE_RULES_KEY }}
          INDEXNOW_KEY: a7c3e19d52b84f60b1d9e4c7a3f2085e
        run: python3 .github/scripts/seo.py
      - name: GA4 numbers
        continue-on-error: true
        env:
          GA_TOKEN: ${{ steps.g.outputs.access_token }}
        run: python3 .github/scripts/ga.py
      - name: Search Console numbers
        continue-on-error: true
        env:
          GSC_TOKEN: ${{ steps.g.outputs.access_token }}
        run: python3 .github/scripts/gsc.py
      - name: Page health and speed
        continue-on-error: true
        env:
          GSC_TOKEN: ${{ steps.g.outputs.access_token }}
        run: python3 .github/scripts/health.py
      - name: Play Store status
        continue-on-error: true
        env:
          PLAY_TOKEN: ${{ steps.g.outputs.access_token }}
        run: python3 .github/scripts/play.py
      - name: Covers for new pages
        continue-on-error: true
        run: python3 .github/scripts/covers.py
      - name: Save status
        run: |
          git config user.name "Haritt Bot"; git config user.email "bot@haritt.com"
          git add seo admin/media
          git diff --cached --quiet || (git commit -m "SEO status" && git pull --rebase -X theirs -q && git push)
