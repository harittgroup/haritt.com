name: Send Yash mail (one-off)
on:
  workflow_dispatch:
jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        env:
          K: ${{ secrets.RESEND_FULL_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          h=open(".github/send/yash.html").read()
          t=open(".github/send/yash.txt").read()
          sig='<table role="presentation" cellpadding="0" cellspacing="0" style="margin:18px 0 0;border-top:1px solid #ECE8EE;padding-top:14px"><tr><td style="padding:14px 12px 0 0;vertical-align:middle"><img src="https://haritt.com/mail/haritt-3d-120.png" width="36" height="36" alt="" style="display:block;border-radius:50%"></td><td style="padding-top:14px;vertical-align:middle"><div class="tx" style="font-size:15px;font-weight:700;color:#1B1A1C;line-height:1.3">Simran Jain</div><div class="mt" style="font-size:13px;color:#6B6670;line-height:1.4">Human Resources (HR)</div><div class="lb" style="font-size:13px;font-weight:700;color:#A70D22;letter-spacing:.06em;line-height:1.4">Haritt Group</div></td></tr></table>'
          k='</div><div class="ft"'
          assert h.count(k)==1
          h=h.replace(k,sig+k)
          k2='Simran Jain\nHaritt Group'
          assert t.count(k2)==1
          t=t.replace(k2,'Simran Jain\nHuman Resources (HR)\nHaritt Group')
          b={"from":"Simran Jain <simran.jain@haritt.com>","to":["yashkhandelwalbtpbpr@gmail.com"],"cc":["harsh.goyal@haritt.com","pulkit.soni@haritt.com"],"reply_to":"simran.jain@haritt.com","subject":"Important: Day 4 progress update needed today","html":h,"text":t}
          r=urllib.request.Request("https://api.resend.com/emails",json.dumps(b).encode(),{"Authorization":"Bearer "+os.environ["K"],"Content-Type":"application/json","User-Agent":"haritt"})
          print(urllib.request.urlopen(r).read().decode())
          PY
