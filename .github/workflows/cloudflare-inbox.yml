name: Cloudflare inbox deploy
on:
  push:
    branches: [main]
    paths: ["workers/haritt-inbox.js", "workers/inbox-migrate.json", ".github/workflows/cloudflare-inbox.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the inbox worker and send inbox@haritt.com to it (all other addresses stay as they are)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_FULL: ${{ secrets.RESEND_FULL_KEY }}
        run: |
          [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] || { echo "Missing Cloudflare secrets"; exit 0; }
          node --check workers/haritt-inbox.js
          API="https://api.cloudflare.com/client/v4"; H="Authorization: Bearer $CF_TOKEN"
          # 1. KV storage
          NS=$(curl -s "$API/accounts/$CF_ACCOUNT/storage/kv/namespaces?per_page=100" -H "$H" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((n['id'] for n in d.get('result',[]) if n['title']=='haritt-inbox'),''))")
          if [ -z "$NS" ]; then
            R=$(curl -s -X POST "$API/accounts/$CF_ACCOUNT/storage/kv/namespaces" -H "$H" -H "Content-Type: application/json" --data '{"title":"haritt-inbox"}'); echo "$R" | head -c 400; echo
            NS=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin).get('result',{}).get('id',''))")
          fi
          [ -n "$NS" ] || { echo "STEP FAILED: could not create KV storage (token needs Workers KV Storage: Edit)"; exit 1; }
          # 2. worker
          META=$(NS="$NS" RK="$RESEND_FULL" python3 -c "import os,json;b=[{'type':'kv_namespace','name':'INBOX','namespace_id':os.environ['NS']}]print(json.dumps({'main_module':'worker.js','compatibility_date':'2024-11-01','bindings':b,'keep_bindings':['secret_text']}))")
          R=$(curl -s -X PUT "$API/accounts/$CF_ACCOUNT/workers/scripts/haritt-inbox" -H "$H" \
            -F "metadata=$META;type=application/json" \
            -F "worker.js=@workers/haritt-inbox.js;filename=worker.js;type=application/javascript+module")
          echo "$R" | head -c 500; echo
          echo "$R" | grep -Eq '"success": *true' || { echo "STEP FAILED: worker upload"; exit 1; }
          SEC="$API/accounts/$CF_ACCOUNT/workers/scripts/haritt-inbox/secrets"
          [ -n "$RESEND_FULL" ] && curl -s -X PUT "$SEC" -H "$H" -H "Content-Type: application/json" --data "{\"name\":\"RESEND\",\"text\":\"$RESEND_FULL\",\"type\":\"secret_text\"}" | head -c 150; echo
          # safety-copy key: made once, lives only as a Cloudflare secret (never shown, never re-made, so old copies stay readable)
          if ! curl -s "$SEC" -H "$H" | grep -q '"BACKUP_KEY"'; then curl -s -X PUT "$SEC" -H "$H" -H "Content-Type: application/json" --data "{\"name\":\"BACKUP_KEY\",\"text\":\"$(openssl rand -base64 32)\",\"type\":\"secret_text\"}" | head -c 150; echo; fi
          curl -s -X POST "$API/accounts/$CF_ACCOUNT/workers/scripts/haritt-inbox/subdomain" -H "$H" -H "Content-Type: application/json" --data '{"enabled":true}' | head -c 300; echo
          # 3. route inbox@haritt.com to the worker (pilot, nothing else changes)
          Z=$(curl -s "$API/zones?name=haritt.com" -H "$H" | python3 -c "import sys,json;print(json.load(sys.stdin)['result'][0]['id'])")
          RULES=$(curl -s "$API/zones/$Z/email/routing/rules?per_page=50" -H "$H")
          RID=$(echo "$RULES" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((r['id'] for r in d.get('result',[]) if any(m.get('value')=='inbox@haritt.com' for m in r.get('matchers',[]))),''))")
          BODY='{"name":"Inbox","enabled":true,"matchers":[{"type":"literal","field":"to","value":"inbox@haritt.com"}],"actions":[{"type":"worker","value":["haritt-inbox"]}]}'
          if [ -n "$RID" ]; then M=PUT; U="$API/zones/$Z/email/routing/rules/$RID"; else M=POST; U="$API/zones/$Z/email/routing/rules"; fi
          R=$(curl -s -X $M "$U" -H "$H" -H "Content-Type: application/json" --data "$BODY"); echo "$R" | head -c 500; echo
          echo "$R" | grep -Eq '"success": *true' || { echo "STEP FAILED: email routing rule"; exit 1; }
          echo "inbox ready"
          # 4. move the listed team addresses to the forwarder (keeps their current Gmail, nothing to verify)
          NS="$NS" Z="$Z" API="$API" H="$H" CF_ACCOUNT="$CF_ACCOUNT" python3 - <<'PY'
          import os, json, subprocess
          def cf(method, path, data=None, raw=False):
              c = ["curl", "-s", "-X", method, os.environ["API"] + path, "-H", os.environ["H"]]
              if data is not None: c += ["-H", "Content-Type: application/json", "--data", data] if not raw else ["-H", "Content-Type: text/plain", "--data", data]
              return subprocess.run(c, capture_output=True, text=True).stdout
          try: wanted = json.load(open("workers/inbox-migrate.json")).get("addresses", [])
          except Exception: wanted = []
          z, ns, acc = os.environ["Z"], os.environ["NS"], os.environ["CF_ACCOUNT"]
          rules = json.loads(cf("GET", "/zones/%s/email/routing/rules?per_page=100" % z)).get("result", [])
          for a in wanted:
              a = a.lower()
              r = next((x for x in rules if any(m.get("value", "").lower() == a for m in x.get("matchers", []))), None)
              if not r: print("skip (no rule):", a); continue
              act = r.get("actions", [{}])[0]
              kv = "/accounts/%s/storage/kv/namespaces/%s/values/dest:%s" % (acc, ns, a)
              if act.get("type") == "forward" and act.get("value"):
                  have = cf("GET", kv)
                  if not have or '"success"' in have[:40]:
                      cf("PUT", kv, act["value"][0], raw=True); print("kept Gmail for", a)
              elif act.get("type") == "worker": print("already moved:", a); continue
              body = json.dumps({"name": r.get("name") or a, "enabled": r.get("enabled", True), "matchers": r["matchers"], "actions": [{"type": "worker", "value": ["haritt-inbox"]}]})
              out = cf("PUT", "/zones/%s/email/routing/rules/%s" % (z, r["id"]), body)
              print("moved" if '"success": true' in out.replace('":true','": true') else "FAILED " + out[:200], a)
          PY
