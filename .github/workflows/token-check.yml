name: Token check
on:
  push:
    branches: [main]
    paths: [".github/workflows/token-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Can the tokens start jobs? (prints only HTTP codes)
        env:
          A: ${{ secrets.CHANGELOG_TOKEN }}
          B: ${{ secrets.CHANGELOG_TOKEN_DEV }}
        run: |
          for T in A B; do V="${!T}"; for R in harittgroup/haritt.com Haritt-Developers/developers-src; do
            echo "$T $R runs-read: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $V" https://api.github.com/repos/$R/actions/runs?per_page=1)"
            echo "$T $R dispatch(bad-ref probe): $(curl -s -o /tmp/o -w '%{http_code}' -X POST -H "Authorization: Bearer $V" https://api.github.com/repos/$R/actions/workflows/build-stamp.yml/dispatches -d '{"ref":"no-such-branch-probe"}') $(head -c 120 /tmp/o)"
          done; done
