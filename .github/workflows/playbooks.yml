# Rebuilds the site every 10 minutes so Playbooks published in haritt.com/admin/playbooks go live without code.
# Run it by hand from the Actions tab to publish straight away.
name: Playbooks
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: playbooks
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python3 -m pip install pillow
      - name: Build
        run: python3 build.py
      - name: Commit changes
        run: |
          rm -rf __pycache__
          CHANGED="$(git status --porcelain | grep -v 'sitemap.xml' || true)"
          if [ -z "$CHANGED" ]; then git checkout -- sitemap.xml 2>/dev/null || true; echo "No Playbooks changes"; exit 0; fi
          git config user.name "Harsh Goyal"
          git config user.email "69347133+harshvittori@users.noreply.github.com"
          git add -A
          git commit -m "HV World update"
          git push
