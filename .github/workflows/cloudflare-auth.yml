name: Cloudflare admin sign-in worker
on:
  push:
    branches: [main]
    paths: ["workers/haritt-auth.js", ".github/workflows/cloudflare-auth.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy haritt-auth
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_FULL: ${{ secrets.RESEND_FULL_KEY }}
          FB_SA: ${{ secrets.FIREBASE_RULES_KEY }}
        run: |
          [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] || { echo "Missing Cloudflare secrets"; exit 1; }
          node --check workers/haritt-auth.js
          API="https://api.cloudflare.com/client/v4"; H="Authorization: Bearer $CF_TOKEN"
          NS=$(curl -s "$API/accounts/$CF_ACCOUNT/storage/kv/namespaces?per_page=100" -H "$H" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((n['id'] for n in d.get('result',[]) if n['title']=='haritt-auth'),''))")
          if [ -z "$NS" ]; then
            NS=$(curl -s -X POST "$API/accounts/$CF_ACCOUNT/storage/kv/namespaces" -H "$H" -H "Content-Type: application/json" --data '{"title":"haritt-auth"}' | python3 -c "import sys,json;print(json.load(sys.stdin).get('result',{}).get('id',''))")
          fi
          [ -n "$NS" ] || { echo "STEP FAILED: KV"; exit 1; }
          META=$(NS="$NS" python3 -c "import os,json;print(json.dumps({'main_module':'worker.js','compatibility_date':'2024-11-01','bindings':[{'type':'kv_namespace','name':'AUTH','namespace_id':os.environ['NS']}],'keep_bindings':['secret_text']}))")
          R=$(curl -s -X PUT "$API/accounts/$CF_ACCOUNT/workers/scripts/haritt-auth" -H "$H" -F "metadata=$META;type=application/json" -F "worker.js=@workers/haritt-auth.js;filename=worker.js;type=application/javascript+module")
          echo "$R" | grep -Eq '"success": *true' || { echo "$R" | head -c 600; echo "STEP FAILED: worker upload"; exit 1; }
          curl -s -X POST "$API/accounts/$CF_ACCOUNT/workers/scripts/haritt-auth/subdomain" -H "$H" -H "Content-Type: application/json" --data '{"enabled":true}' | head -c 120; echo
          SEC="$API/accounts/$CF_ACCOUNT/workers/scripts/haritt-auth/secrets"
          put() { python3 -c "import json,sys,os;print(json.dumps({'name':sys.argv[1],'text':os.environ['V'],'type':'secret_text'}))" "$1" | curl -s -X PUT "$SEC" -H "$H" -H "Content-Type: application/json" --data @- | grep -o '"success": *[a-z]*'; }
          V="$FB_SA" put FB_SA; V="$RESEND_FULL" put RESEND
          curl -s "$SEC" -H "$H" | grep -q '"PEPPER"' || { V="$(openssl rand -base64 32)" put PEPPER; }
          echo "SECRETS: $(curl -s "$SEC" -H "$H" | python3 -c "import sys,json;print([x['name'] for x in json.load(sys.stdin).get('result',[])])")"
          sleep 5; echo "PING: $(curl -s https://haritt-auth.harittgroup.workers.dev)"
          echo "START: $(curl -s -X POST https://haritt-auth.harittgroup.workers.dev -H 'Origin: https://haritt.com' -H 'Content-Type: application/json' --data '{"action":"pk_auth_start"}' | head -c 120)"
