name: Firestore rules deploy
on:
  push:
    branches: [main]
    paths: ["admin/rules/index.html"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check key
        id: k
        env:
          SA: ${{ secrets.FIREBASE_RULES_KEY }}
        run: '[ -n "$SA" ] && echo "ok=1" >> $GITHUB_OUTPUT || echo "Add FIREBASE_RULES_KEY in repo Settings > Secrets > Actions"'
      - name: Publish the rules from admin/rules to Firebase (harsh-reset)
        if: steps.k.outputs.ok == '1'
        env:
          SA: ${{ secrets.FIREBASE_RULES_KEY }}
        run: pip install -q google-auth requests && python3 .github/scripts/deploy-rules.py harsh-reset admin/rules/index.html
