name: Cloudflare worker deploy
on:
  push:
    branches: [main]
    paths: ["workers/haritt-join.js"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload code to the haritt-join worker (settings, secrets and routes stay as they are)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] || { echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repo Settings > Secrets > Actions"; exit 0; }
          node --check workers/haritt-join.js
          R=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/haritt-join/content" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F "worker.js=@workers/haritt-join.js;filename=worker.js;type=application/javascript+module")
          echo "$R" | head -c 600; echo
          echo "$R" | grep -Eq '"success": *true' || exit 1
          # give the worker the Cloudflare token + account so the admin Email addresses page can manage mail forwarding (nothing to paste)
          for P in "CF_TOKEN:$CF_TOKEN" "CF_ACCOUNT:$CF_ACCOUNT"; do
            N="${P%%:*}"; V="${P#*:}"
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/haritt-join/secrets" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"name\":\"$N\",\"text\":\"$V\",\"type\":\"secret_text\"}" | head -c 200; echo
          done
