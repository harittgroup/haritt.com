name: Resend sync
on:
  schedule:
    - cron: "10 3 * * *"
    - cron: "10 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: resend-sync
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch status from developers-src
        env:
          T: ${{ secrets.CHANGELOG_TOKEN_DEV }}
        run: |
          mkdir -p status
          curl -fsSL -H "Authorization: Bearer $T" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/haritt-developers/developers-src/contents/infra/resend/status.json?ref=main" -o status/resend.json
          python3 -c "import json;json.load(open('status/resend.json'))"
      - name: Fetch system status
        env:
          T: ${{ secrets.CHANGELOG_TOKEN_DEV }}
        run: |
          curl -fsSL -H "Authorization: Bearer $T" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/haritt-developers/developers-src/contents/infra/system/status.json?ref=main" -o status/system.json
          python3 -c "import json;json.load(open('status/system.json'))"
      - name: Token expiry
        continue-on-error: true
        env:
          CHANGELOG_TOKEN: ${{ secrets.CHANGELOG_TOKEN }}
          CHANGELOG_TOKEN_DEV: ${{ secrets.CHANGELOG_TOKEN_DEV }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_FULL_KEY: ${{ secrets.RESEND_FULL_KEY }}
        run: python3 .github/scripts/tokens.py
      - name: Save
        run: |
          git config user.name "Haritt Bot"; git config user.email "bot@haritt.com"
          git add status
          git diff --cached --quiet || (git commit -m "Email status" && git pull --rebase -X theirs -q && git push)
