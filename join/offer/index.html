<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Offer letter · Haritt Group</title>
<meta name="theme-color" content="#F6F1EA">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<link rel="stylesheet" href="../ph/style.css">
<script src="../join-config.js"></script>
<style>
:root{--r:#8B0D0D;--rbg:#F8EEEE;--rln:#EBCFCF;--ink:#17140F;--soft:#5E574E;--faint:#8F877C;--line:#E7E0D6;--bg:#F6F1EA;--card:#fff;--ok:#1F7A4D;--okbg:#E9F5EE;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.65 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
.top{max-width:820px;margin:0 auto;padding:20px 20px 0;display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px}.top b{font:700 13.5px Montserrat;letter-spacing:.24em}.top b em{font-style:normal;color:var(--r)}.top .sp{flex:1}
.top button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--soft);font:600 13px Inter;padding:8px 13px;border-radius:99px;cursor:pointer;transition:border-color .2s,color .2s}.top button:hover{border-color:var(--rln);color:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 140px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(60,35,15,.10);overflow:hidden;animation:up .6s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.band{background:#16110F;background-image:linear-gradient(125deg,#16110F 0%,#2B0B0B 55%,#7A0C0C 100%);color:#fff;padding:22px 34px;display:flex;align-items:center;gap:12px}
.band img{width:38px;height:38px}.band b{font:700 12px Montserrat;letter-spacing:.24em}.band .sp{flex:1}.band .pl{border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:5px 12px;font:700 10.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:#F3D9D9}
.in{padding:34px 40px 36px}
.bar{width:34px;height:3px;border-radius:3px;background:var(--r);margin-bottom:16px}
h1{font:800 30px/1.2 Montserrat;letter-spacing:-.015em}
.lead{font-size:16.5px;color:var(--soft);margin-top:12px;max-width:620px}.lead b{color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0 6px}
.kv div{background:#FBF8F5;border:1px solid #EEE7DF;border-radius:14px;padding:12px 14px;min-width:0}
.kv span{display:block;font:700 10.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.kv b{display:block;font-size:14.5px;font-weight:600;margin-top:3px;overflow-wrap:anywhere}
.kv .w{grid-column:span 2}
h2{display:flex;align-items:center;gap:10px;font:700 15px Montserrat;margin:30px 0 12px}h2 i{color:var(--r);font-size:20px}
ul.ls{list-style:none;display:grid;gap:9px}ul.ls li{display:flex;gap:10px;color:var(--soft);font-size:14.5px}ul.ls li i{color:var(--r);flex:none;margin-top:4px}
.how{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.how div{border:1px solid var(--line);border-radius:14px;padding:13px 15px}.how b{display:block;font-size:14px}.how p{font-size:13.5px;color:var(--soft);margin-top:2px}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tl div{position:relative;padding:12px 12px 12px;border-radius:14px;background:#FBF8F5;border:1px solid #EEE7DF}.tl small{display:block;font:700 10.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--r)}.tl b{display:block;font-size:13.5px;margin-top:2px}.tl p{font-size:12.5px;color:var(--soft);margin-top:2px;line-height:1.45}
.sig{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:32px;padding-top:22px;border-top:1px solid var(--line)}
.sig b{display:block;font-size:15px}.sig small{display:block;color:var(--faint);font-size:13px}
.note{font-size:13px;color:var(--faint);margin-top:18px}
/* states */
.st{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;margin:0 0 18px;animation:up .45s var(--ease) both}
.st i{font-size:24px;flex:none}.st b{display:block;font-size:15px}.st p{font-size:14px;color:var(--soft);margin-top:2px}
.st.ok{background:var(--okbg);color:var(--ok)}.st.ok b{color:var(--ok)}.st.wn{background:var(--rbg);color:var(--r)}.st.wn b{color:var(--r)}
.st .bt{margin-top:12px}
/* action bar */
.act{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(246,241,234,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .45s var(--ease)}
.act.on{transform:none}
.act .in2{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.act .tx{flex:1;font-size:13.5px;color:var(--soft);line-height:1.4}.act .tx b{color:var(--ink)}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 22px;font:700 15px Inter;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;white-space:nowrap}
.bt:active{transform:scale(.97)}.bt:disabled{opacity:.6;cursor:default}
.bt.p{background:var(--r);background-image:linear-gradient(180deg,#A3151B,#7E0B0B);color:#fff;box-shadow:0 8px 20px rgba(139,13,13,.25)}.bt.p:hover{box-shadow:0 10px 26px rgba(139,13,13,.35)}
.bt.g{background:var(--card);color:var(--soft);border:1px solid var(--line)}.bt.g:hover{color:var(--ink);border-color:#D8CFC3}
.spn{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.dec{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}.dec.on{grid-template-rows:1fr}.dec>div{overflow:hidden;min-height:0}
.dec .box{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card)}
.dec textarea{width:100%;min-height:70px;resize:vertical;font:500 14.5px Inter;border:1px solid #DCD3C8;border-radius:12px;padding:10px 12px;outline:0;margin:8px 0 10px}.dec textarea:focus{border-color:var(--r);box-shadow:0 0 0 3px rgba(139,13,13,.1)}
.dec .r{display:flex;gap:8px;justify-content:flex-end}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#EFE9E1,#F7F3EE,#EFE9E1);background-size:200% 100%;animation:sh 1.3s linear infinite;margin:10px 0}@keyframes sh{to{background-position:-200% 0}}
.foot{text-align:center;font-size:12px;color:var(--faint);margin-top:22px;line-height:1.7}
@media(max-width:640px){.band b{letter-spacing:.16em;white-space:nowrap}.band .pl{white-space:nowrap}.in{padding:26px 20px 28px}.band{padding:18px 20px}h1{font-size:25px}.kv{grid-template-columns:1fr 1fr}.kv .w{grid-column:span 2}.how{grid-template-columns:1fr}.tl{grid-template-columns:1fr 1fr}.act .tx{display:none}.act .bt{flex:1;padding:13px 12px}.top button span{display:none}}
@media print{body{background:#fff}.top button,.act,.st,.foot{display:none!important}.wrap{padding:0}.sheet{box-shadow:none;border:0}.band{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head><body>
<div class="top"><img src="/haritt-3d.png" alt=""><b>HARITT <em>GROUP</em></b><span class="sp"></span><button id="pr" hidden><i class="ph ph-printer"></i><span>Save as PDF</span></button></div>
<main class="wrap"><div id="msg"></div><div id="doc"><div class="sheet"><div class="band"><img src="/haritt-3d.png" alt=""><b>HARITT GROUP</b><span class="sp"></span><span class="pl">Offer letter</span></div><div class="in"><div class="sk" style="width:40%;height:26px"></div><div class="sk"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:60%"></div></div></div></div>
<p class="foot">Haritt Group · haritt.com<br>Behind Shiva Talkies, Sahyog Nagar, Bharatpur, Rajasthan 321001 · Jaipur · Bharatpur</p></main>
<div class="act" id="act"><div class="in2"><span class="tx" id="actTx"></span><button class="bt g" id="bNo">Decline</button><button class="bt p" id="bYes"><i class="ph ph-check"></i>Accept offer</button></div>
<div class="in2" style="display:block"><div class="dec" id="dec"><div><div class="box"><b style="font-size:14.5px">Decline this offer?</b><textarea id="why" placeholder="Reason (optional). Only the team sees this."></textarea><div class="r"><button class="bt g" id="dX">Keep the offer</button><button class="bt p" id="dGo" style="background:#3D3730;box-shadow:none">Confirm decline</button></div></div></div></div></div></div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},q=new URLSearchParams(location.search),ID=q.get("id")||"",T=q.get("t")||"",D=null;
  function e(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function api(b){b.id=ID;b.t=T;if(window.__OFFER_TEST)return window.__OFFER_TEST(b);return window.joinFetch?window.joinFetch(b):Promise.reject()}
  function st(kind,icon,title,text,btn){$("msg").innerHTML='<div class="st '+kind+'"><i class="ph '+icon+'"></i><div><b>'+title+'</b><p>'+text+'</p>'+(btn||"")+'</div></div>'}
  function bar(on){$("act").classList.toggle("on",!!on)}
  function render(d){
    var first=String(d.name).split(" ")[0];
    $("doc").innerHTML='<div class="sheet"><div class="band"><img src="/haritt-3d.png" alt=""><b>HARITT GROUP</b><span class="sp"></span><span class="pl">Offer letter</span></div><div class="in">'+
    '<div class="bar"></div><h1>Hi '+e(d.name)+',</h1><p class="lead">Congratulations. After our talk, we are happy to offer you the role of <b>'+e(d.pos)+'</b> at Haritt Group. This letter explains the role, how we work, and what happens next.</p>'+
    '<div class="kv"><div class="w"><span>Position</span><b>'+e(d.pos)+'</b></div><div><span>Level</span><b>'+e(d.lv)+'</b></div><div><span>Start date</span><b>'+e(d.start)+'</b></div><div><span>Offer ID</span><b>'+e(d.id)+'</b></div><div><span>Valid until</span><b>'+e(d.exp)+'</b></div></div>'+
    (d.sum||(d.own&&d.own.length)?'<h2><i class="ph ph-briefcase"></i>Your role</h2>'+(d.sum?'<p class="lead" style="margin:0 0 12px;font-size:15px">'+e(d.sum)+'</p>':'')+(d.own&&d.own.length?'<ul class="ls">'+d.own.map(function(x){return '<li><i class="ph ph-check"></i><span>'+e(x)+'</span></li>'}).join("")+'</ul>':''):'')+
    '<h2><i class="ph ph-hand-heart"></i>How we work</h2><div class="how">'+
    '<div><b>No fixed hours</b><p>We look at the work you deliver, not the time you log.</p></div>'+
    '<div><b>Clear communication</b><p>Reply on time, share short updates, and say early when something is stuck.</p></div>'+
    '<div><b>Ownership</b><p>Own your tasks from start to finish, like it is your own company.</p></div>'+
    '<div><b>Confidentiality</b><p>Everything about Haritt stays private, from day one.</p></div></div>'+
    '<h2><i class="ph ph-calendar-blank"></i>Your first 10 days</h2><div class="tl">'+
    '<div><small>Days 1 to 3</small><b>Learn</b><p>How Haritt Group works.</p></div>'+
    '<div><small>Day 4</small><b>Access</b><p>Company email and tools.</p></div>'+
    '<div><small>Day 5 onward</small><b>Real work</b><p>Small, real tasks in your role.</p></div>'+
    '<div><small>Day 10</small><b>Review</b><p>We confirm your level together.</p></div></div>'+
    '<h2><i class="ph ph-file-text"></i>Next step</h2><p class="lead" style="margin:0;font-size:15px">When you accept, you get your <b>Step 1 Joining Agreement</b> to read and sign online. It takes about 5 minutes on your phone.</p>'+
    '<div class="sig"><div><b>'+e(d.by.name)+'</b><small>'+e(d.by.role)+' · Haritt Group</small><small>'+e(d.by.email)+'</small></div><div style="text-align:right"><small>Issued on</small><b>'+e(d.issued)+'</b></div></div>'+
    '<p class="note">Have a question before you decide? Reply to the offer email, or write to '+e(d.by.email)+'.</p></div></div>';
    $("pr").hidden=false;
    $("actTx").innerHTML="<b>"+e(first)+"</b>, please reply by "+e(d.exp)+".";
    state(d);
  }
  function state(d){
    if(d.closed){st("wn","ph-warning-circle","This offer is closed","Please reply to the offer email if you have a question.");bar(0);return}
    if(d.reply==="yes"){st("ok","ph-seal-check","You accepted this offer","Your joining agreement is ready. We have also sent it to your email.",d.agLink?'<a class="bt p bt" href="'+e(d.agLink)+'">Sign joining agreement <i class="ph ph-arrow-right"></i></a>':"");bar(0);return}
    if(d.reply==="no"){st("wn","ph-x","You declined this offer","Thank you for letting us know. If things change, just reply to the offer email.");bar(0);return}
    if(d.expired){st("wn","ph-clock","This offer has expired","Please reply to the offer email and we will help.");bar(0);return}
    $("msg").innerHTML="";setTimeout(function(){bar(1)},500);
  }
  function fail(code){var m={link:["This link does not work","Please open the link from your offer email again."],network:["Could not connect","Check your internet and refresh this page."]}[code]||["Something went wrong","Please refresh this page."];
    $("doc").innerHTML="";st("wn","ph-warning-circle",m[0],m[1]);bar(0)}
  $("pr").onclick=function(){window.print()};
  $("bYes").onclick=function(){var b=this;b.disabled=true;$("bNo").disabled=true;b.innerHTML='<i class="ph ph-circle-notch spn"></i>Accepting…';
    api({action:"offer_reply",yes:true}).then(function(r){if(!r.ok&&r.error!=="done")throw r;D.reply="yes";D.agLink=r.agLink||D.agLink;state(D);scrollTo({top:0,behavior:"smooth"})}).catch(function(r){b.disabled=false;$("bNo").disabled=false;b.innerHTML='<i class="ph ph-check"></i>Accept offer';if(r&&r.error==="expired"){D.expired=true;state(D)}else alert2()})};
  function alert2(){st("wn","ph-warning-circle","That did not go through","Please try again in a moment.");scrollTo({top:0,behavior:"smooth"})}
  $("bNo").onclick=function(){$("dec").classList.add("on");setTimeout(function(){$("why").focus()},300)};
  $("dX").onclick=function(){$("dec").classList.remove("on")};
  $("dGo").onclick=function(){var b=this;b.disabled=true;b.innerHTML='<i class="ph ph-circle-notch spn"></i>Sending…';
    api({action:"offer_reply",yes:false,why:$("why").value}).then(function(r){if(!r.ok&&r.error!=="done")throw r;$("dec").classList.remove("on");D.reply="no";state(D);scrollTo({top:0,behavior:"smooth"})}).catch(function(){b.disabled=false;b.textContent="Confirm decline";alert2()})};
  if(!/^HG-AP-\d{4}-[A-Z0-9]{4}$/.test(ID)||!T){fail("link");return}
  api({action:"offer_view"}).then(function(r){if(!r||!r.ok)return fail(r&&r.error||"x");D=r;render(r)}).catch(function(){fail("network")});
})();
</script>
</body></html>
